      margin: 0;
      padding: 0;
      overscroll-behavior-y: none;
    }
    /* Prevent iOS Safari date/time inputs from overflowing grid columns */
    input[type="date"],
    input[type="time"],
    input[type="text"],
    input[type="number"],
    input[type="tel"],
    input[type="email"],
    input[type="password"],
    input[type="url"],
    select,
    textarea {
      max-width: 100%;
      min-width: 0;
    }
    input[type="date"],
    input[type="time"] {
      -webkit-appearance: none;
      appearance: none;
      min-height: 38px;
    }
    .safe-top {
      padding-top: max(env(safe-area-inset-top), 14px);
    }
    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom), 14px);
    }
    .glass-header {
      background: rgba(242, 242, 247, 0.90);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .glass-tabbar {
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideUp {
      from { transform: translateY(24px); opacity: 0.4; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-sheet {
      animation: slideUp 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;

        msgCancelled: 'Hi {Name}, sorry to inform you that {RideName} scheduled for {Date} at {Time} has been cancelled due to unavoidable reasons.',
        lastSyncedAt: ''
      }
    };

    function normalizeState(raw) {
      const merged = {
        ...defaultState,
        ...(raw || {}),
        settings: { ...defaultState.settings, ...((raw && raw.settings) || {}) }
      };

      // Backfill joinedDate for existing riders from their earliest ride date
      const earliestRideDateByRider = {};
      (merged.rides || []).forEach(ride => {
        (ride.passengers || []).forEach(p => {
          const key = p.riderId || p.name;
          if (!earliestRideDateByRider[key] || ride.date < earliestRideDateByRider[key]) {
            earliestRideDateByRider[key] = ride.date;
          }
        });
      });

      merged.riders = (merged.riders || []).map(r => {
        const inferred = earliestRideDateByRider[r.id] || earliestRideDateByRider[r.name] || todayStr();
        return {
          ...r,
          joinedDate: r.joinedDate || inferred
        };
      });

      // Normalize fuelLogs into unified expense entries (default category = 'Fuel')
      merged.fuelLogs = (merged.fuelLogs || []).map(entry => ({
        ...entry,
        category: entry.category || 'Fuel',
        notes: entry.notes || '',
        pricePerLiter: entry.pricePerLiter || (entry.liters > 0 && entry.totalCost > 0 ? Number((entry.totalCost / entry.liters).toFixed(2)) : 0)
      }));

      return merged;
    }

    let state = normalizeState(loadLocalRaw());

    function hasMeaningfulLocalData() {

      if (!saved) return false;
      try {
        const parsed = JSON.parse(saved);
        return (parsed.rides && parsed.rides.length > 0) || (parsed.fuelLogs && parsed.fuelLogs.length > 0) || (parsed.riders && parsed.riders.length > 2);

    async function attachUserCloudListener(user) {
      const docRef = window.db.collection('users').doc(user.uid);
      setCloudBadge('syncing');

      try {
        const initialSnap = await docRef.get();
        if (!initialSnap.exists) {
          const migrated = hasMeaningfulLocalData();
          await docRef.set({
            email: user.email,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            state: JSON.parse(JSON.stringify(state))
          });
          if (migrated) {
            showToast('Existing data uploaded to your cloud account!');
          }
        }
      } catch (e) {
        console.error('Initial cloud check error:', e);
      }

      if (firestoreUnsubscribe) firestoreUnsubscribe();
      firestoreUnsubscribe = docRef.onSnapshot((doc) => {
        if (doc.exists && doc.data().state) {
          isApplyingRemoteSnapshot = true;
          state = normalizeState(doc.data().state);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          setCloudBadge('synced');
          renderApp();
          isApplyingRemoteSnapshot = false;
        }
      }, (err) => {

        setCloudBadge('offline');

    }

    /*****************************************************************
     * 5. DATE, TIME, PHONE & MESSAGE FORMATTING HELPERS
     *****************************************************************/
    function formatDateDisplay(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).replace(/ /g, '-');
    }

    function formatShortDate(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
    }

    function formatTime12Hr(time24) {
      if (!time24) return '';
      const [hStr, mStr] = time24.split(':');
      let h = parseInt(hStr, 10);
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${String(h).padStart(2, '0')}:${mStr} ${ampm}`;
    }

    function getWeekStartStr(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1); // Monday start
      const mon = new Date(d.setDate(diff));
      return mon.toISOString().slice(0, 10);
    }

    function isDateInPeriod(dateStr, period) {
      if (!period || period === 'all') return true;
      if (!dateStr) return false;
      const now = new Date();
      const target = new Date(dateStr + 'T00:00:00');
      if (period === 'today') return dateStr === todayStr();
      if (period === 'week') {
        const startOfWeek = new Date(now);
        startOfWeek.setHours(0, 0, 0, 0);
        startOfWeek.setDate(now.getDate() - now.getDay());
        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setDate(startOfWeek.getDate() + 7);
        return target >= startOfWeek && target < endOfWeek;
      }
      if (period === 'month') return target.getFullYear() === now.getFullYear() && target.getMonth() === now.getMonth();
      if (period === 'quarter') {
        return target.getFullYear() === now.getFullYear() && Math.floor(now.getMonth() / 3) === Math.floor(target.getMonth() / 3);
      }
      if (period === 'year') return target.getFullYear() === now.getFullYear();
      return true;
    }

    function normalizePhonePlus(phone) {
      const digits = (phone || '').replace(/[^0-9]/g, '');
      if (!digits) return '';
      if (digits.length === 10) return '+91' + digits;
      return '+' + digits;
    }

    function compileMessage(template, vars) {
      let msg = template || '';
      const map = {
        '{Name}': vars.name || 'Rider',
        '{RideName}': vars.rideName || '',
        '{Pickup}': vars.pickup || '',
        '{Drop}': vars.drop || '',
        '{Amount}': vars.amount != null ? vars.amount : '',
        '{Date}': vars.date || '',
        '{Time}': vars.time || '',
        '{UPI}': state.settings.upiId || '',
        '{LocationLink}': vars.locationLink || ''
      };
      for (const [key, val] of Object.entries(map)) {
        msg = msg.split(key).join(val);
      }
      return msg;
    }

    function buildWhatsAppUrl(phone, text) {
      const cleanPhone = (phone || '').replace(/[^0-9]/g, '');
      if (cleanPhone) {
        return `https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`;
      }
      return `https://wa.me/?text=${encodeURIComponent(text)}`;
    }

    function buildShortcutBatchUrl(items) {
      const jsonStr = JSON.stringify(items);
      return `shortcuts://run-shortcut?name=CarpoolNotify&input=text&text=${encodeURIComponent(jsonStr)}`;
    }

    function getRiderRideFrequencyMap() {
      const counts = {};
      state.rides.forEach(ride => {
        (ride.passengers || []).forEach(p => {
          if (p.riderId) counts[p.riderId] = (counts[p.riderId] || 0) + 1;
          if (p.name) counts['name:' + p.name] = (counts['name:' + p.name] || 0) + 1;
        });
      });
      return counts;
    }

    function renderRidesFinanceDashboard() {
      const filteredRides = state.rides.filter(r => isDateInPeriod(r.date, dashboardPeriod));
      const filteredExpenses = state.fuelLogs.filter(f => isDateInPeriod(f.date, dashboardPeriod));

      let totalBilled = 0;
      let totalCollected = 0;
      let totalPending = 0;
      let totalRideTolls = 0;
      const pendingItems = [];
      const routeStats = {};
      const dateStats = {};

      filteredRides.forEach(ride => {
        const toll = Number(ride.tollCost) || 0;
        totalRideTolls += toll;

        if (!routeStats[ride.routeName]) {
          routeStats[ride.routeName] = { trips: 0, billed: 0, collected: 0, tolls: 0 };
        }
        routeStats[ride.routeName].trips += 1;
        routeStats[ride.routeName].tolls += toll;

        if (!dateStats[ride.date]) {
          dateStats[ride.date] = { trips: 0, billed: 0, collected: 0, expense: toll };
        } else {
          dateStats[ride.date].expense += toll;
        }
        dateStats[ride.date].trips += 1;

        ride.passengers.forEach(p => {
          const fare = Number(p.fare) || 0;
          const paidAmt = p.paid ? (Number(p.paidAmount) || fare) : (Number(p.paidAmount) || 0);
          const due = Math.max(0, fare - paidAmt);

          totalBilled += fare;
          totalCollected += paidAmt;
          totalPending += due;

          routeStats[ride.routeName].billed += fare;
          routeStats[ride.routeName].collected += paidAmt;
          dateStats[ride.date].billed += fare;
          dateStats[ride.date].collected += paidAmt;

          if (due > 0 && ride.status === 'completed') {
            pendingItems.push({
              rideId: ride.id,
              rideName: ride.routeName,
              date: ride.date,
              riderId: p.riderId,
              name: p.name,
              phone: p.phone,
              due
            });
          }
        });
      });

      let totalLoggedExpenses = 0;
      filteredExpenses.forEach(f => {
        const cost = Number(f.totalCost) || 0;
        totalLoggedExpenses += cost;
        if (!dateStats[f.date]) {
          dateStats[f.date] = { trips: 0, billed: 0, collected: 0, expense: cost };
        } else {
          dateStats[f.date].expense += cost;
        }
      });

      const netRecovery = totalCollected - (totalLoggedExpenses + totalRideTolls);
      const paidPct = totalBilled > 0 ? Math.min(100, Math.round((totalCollected / totalBilled) * 100)) : 0;

      // Build Chart Data (Last 8 active dates in period)
      const chartDates = Object.entries(dateStats)
        .sort((a, b) => a[0].localeCompare(b[0]))
        .slice(-8);

      const maxChartVal = Math.max(100, ...chartDates.map(([, s]) => Math.max(s.collected, s.billed, s.expense)));

      const financeChartHtml = chartDates.length === 0
        ? `<p class="text-xs text-gray-400 text-center py-8">No financial activity to graph in this period.</p>`
        : `
          <div class="space-y-3">
            <div class="flex items-center justify-between text-[11px] text-gray-500">
              <div class="flex items-center gap-3">
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-emerald-500 inline-block"></span> Collected</span>
                <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-xs bg-rose-400 inline-block"></span> Expenses &amp; Tolls</span>
              </div>
              <span>Last ${chartDates.length} active days</span>
            </div>
            <div class="grid grid-cols-${chartDates.length} gap-2 items-end h-36 pt-4 px-1 border-b border-gray-100">
              ${chartDates.map(([dStr, s]) => {
                const colH = Math.max(4, Math.round((s.collected / maxChartVal) * 100));
                const expH = Math.max(4, Math.round((s.expense / maxChartVal) * 100));
                return `
                  <div class="flex flex-col items-center gap-1 h-full justify-end">
                    <div class="flex items-end gap-1 w-full justify-center h-28">
                      <div class="w-2.5 md:w-3.5 bg-emerald-500 rounded-t-sm transition-all" style="height: ${s.collected > 0 ? colH : 2}%" title="Collected: ${formatCurrency(s.collected)}"></div>
                      <div class="w-2.5 md:w-3.5 bg-rose-400 rounded-t-sm transition-all" style="height: ${s.expense > 0 ? expH : 2}%" title="Expenses/Tolls: ${formatCurrency(s.expense)}"></div>
                    </div>
                    <span class="text-[9px] text-gray-500 font-medium truncate max-w-full">${formatShortDate(dStr)}</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;

      const pendingHtml = pendingItems.length === 0
        ? `<div class="bg-white rounded-2xl p-4 border border-gray-100 text-center text-xs text-gray-500">All completed rides are settled! No pending dues.</div>`
        : pendingItems.map(item => {
            const reminderText = compileMessage(state.settings.msgReminder, {
              name: item.name,
              rideName: item.rideName,
              amount: item.due,
              date: formatDateDisplay(item.date)
            });
            const waUrl = buildWhatsAppUrl(item.phone, reminderText);
            return `
              <div class="bg-white rounded-2xl p-3.5 border border-orange-100 shadow-xs flex items-center justify-between gap-2">
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <span class="font-bold text-sm text-gray-900 truncate">${escapeHtml(item.name)}</span>
                    <span class="text-[11px] font-bold text-red-600 bg-red-50 px-2 py-0.5 rounded-md shrink-0">${formatCurrency(item.due)}</span>
                  </div>

      return `

          <!-- Hero Profit Card -->

    function renderRidersDashboard() {
      const totalRidersCount = state.riders.length;
      const newRidersInPeriod = state.riders.filter(r => isDateInPeriod(r.joinedDate, dashboardPeriod));

      // Build Weekly New Riders Chart (Last 8 Weeks)
      const weekBuckets = [];
      const now = new Date();
      for (let i = 7; i >= 0; i--) {
        const d = new Date(now);
        d.setDate(now.getDate() - i * 7);
        const wkStr = getWeekStartStr(d.toISOString().slice(0, 10));
        if (!weekBuckets.some(b => b.weekStart === wkStr)) {
          weekBuckets.push({ weekStart: wkStr, count: 0 });
        }
      }
      state.riders.forEach(r => {
        if (!r.joinedDate) return;
        const wk = getWeekStartStr(r.joinedDate);
        const bucket = weekBuckets.find(b => b.weekStart === wk);
        if (bucket) bucket.count += 1;
      });
      const maxWeeklyNew = Math.max(1, ...weekBuckets.map(b => b.count));

      const weeklyChartHtml = `
        <div class="space-y-3">
          <div class="flex items-center justify-between text-[11px] text-gray-500">
            <span>New Riders Joined Per Week</span>
            <span>Last ${weekBuckets.length} weeks</span>
          </div>
          <div class="grid grid-cols-${weekBuckets.length} gap-2 items-end h-36 pt-4 px-1 border-b border-gray-100">
            ${weekBuckets.map(b => {
              const barH = b.count > 0 ? Math.max(14, Math.round((b.count / maxWeeklyNew) * 100)) : 4;
              return `
                <div class="flex flex-col items-center gap-1 h-full justify-end">
                  <span class="text-[10px] font-bold ${b.count > 0 ? 'text-blue-600' : 'text-gray-300'}">${b.count}</span>
                  <div class="w-5 md:w-7 ${b.count > 0 ? 'bg-blue-600' : 'bg-gray-100'} rounded-t-md transition-all" style="height: ${barH}%"></div>
                  <span class="text-[9px] text-gray-500 font-medium truncate max-w-full">${formatShortDate(b.weekStart)}</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;

      // Aggregate rider stats across ALL rides (or period rides for earnings) while sorting Top Riders by total ride count
      const riderLeaderboard = state.riders.map(r => {
        let totalRides = 0;
        let periodRides = 0;
        let billed = 0;
        let collected = 0;
        let pending = 0;

        state.rides.forEach(ride => {
          ride.passengers.forEach(p => {
            if (p.riderId === r.id || p.name === r.name) {
              totalRides += 1;
              if (isDateInPeriod(ride.date, dashboardPeriod)) {
                periodRides += 1;
                const fare = Number(p.fare) || 0;
                const paid = p.paid ? (Number(p.paidAmount) || fare) : (Number(p.paidAmount) || 0);
                billed += fare;
                collected += paid;
                pending += Math.max(0, fare - paid);
              }
            }
          });
        });

        return {
          ...r,
          totalRides,
          periodRides,
          billed,
          collected,
          pending
        };
      }).sort((a, b) => b.totalRides - a.totalRides || b.billed - a.billed);

      const newRidersListHtml = newRidersInPeriod.length === 0
        ? `<p class="text-xs text-gray-400 text-center py-4">No new riders joined in this selected period.</p>`
        : newRidersInPeriod.map(r => `
            <div class="py-2.5 border-b border-gray-100 last:border-0 flex items-center justify-between gap-2 text-xs">
              <div class="min-w-0">
                <p class="font-bold text-gray-900 truncate">${escapeHtml(r.name)} ${r.company ? `<span class="text-[10px] font-semibold text-indigo-600">(${escapeHtml(r.company)})</span>` : ''}</p>
                <p class="text-[11px] text-gray-500 truncate">${escapeHtml(r.pickup)} ${ICONS.arrowRight} ${escapeHtml(r.drop)}</p>
              </div>
              <span class="text-[10px] font-semibold bg-emerald-50 text-emerald-700 px-2 py-1 rounded-lg shrink-0">Joined ${formatDateDisplay(r.joinedDate)}</span>
            </div>
          `).join('');

      const leaderboardHtml = riderLeaderboard.length === 0
        ? `<p class="text-xs text-gray-400 text-center py-4">No riders in database yet.</p>`
        : riderLeaderboard.map((r, idx) => `
            <button onclick="openRiderDrilldown('${r.name.replace(/'/g, "\\'")}')" class="w-full text-left py-3 border-b border-gray-100 last:border-0 flex items-center justify-between active:bg-gray-50 hover:bg-gray-50 rounded-lg px-1.5 transition gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <span class="w-6 h-6 rounded-full text-[11px] font-bold flex items-center justify-center shrink-0 ${idx < 3 ? 'bg-amber-100 text-amber-800' : 'bg-gray-100 text-gray-600'}">#${idx + 1}</span>
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <p class="text-sm font-bold text-gray-900 truncate">${escapeHtml(r.name)}</p>
                    <span class="text-[10px] font-bold bg-blue-50 text-blue-700 px-2 py-0.5 rounded-full shrink-0">${r.totalRides} Ride${r.totalRides === 1 ? '' : 's'}</span>
                  </div>
                  <p class="text-[11px] text-gray-500 mt-0.5 truncate">${r.company ? escapeHtml(r.company) + ' &bull; ' : ''}Joined ${formatDateDisplay(r.joinedDate)}</p>
                </div>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <div class="text-right">
                  <p class="text-sm font-bold text-gray-900">${formatCurrency(r.billed)}</p>
                  <p class="text-[11px] font-semibold ${r.pending > 0 ? 'text-red-500' : 'text-emerald-600'}">
                    ${r.pending > 0 ? `Due: ${formatCurrency(r.pending)}` : 'Settled'}
                  </p>
                </div>
                ${ICONS.chevron}
              </div>
            </button>
          `).join('');

      return `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
          <!-- Left KPI Cards -->
          <div class="lg:col-span-5 grid grid-cols-2 gap-3">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 text-white rounded-3xl p-4 shadow-xs flex flex-col justify-between">
              <p class="text-[11px] uppercase tracking-wider text-blue-100 font-semibold">Total Riders</p>
              <p class="text-3xl font-bold my-2">${totalRidersCount}</p>
              <p class="text-[11px] text-blue-100">Registered in Riders DB</p>
            </div>
            <div class="bg-white rounded-3xl p-4 shadow-xs border border-gray-100 flex flex-col justify-between">
              <p class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold">First-Time Riders</p>
              <p class="text-3xl font-bold text-emerald-600 my-2">+${newRidersInPeriod.length}</p>
              <p class="text-[11px] text-gray-500 capitalize">In selected ${dashboardPeriod}</p>
            </div>
          </div>

          <!-- Weekly New Riders Chart -->
          <div class="lg:col-span-7 bg-white rounded-3xl p-5 shadow-xs border border-gray-100">
            <h2 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">Weekly Rider Growth</h2>
            ${weeklyChartHtml}
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-4">
          <!-- Top Riders Leaderboard -->
          <section class="lg:col-span-7 bg-white rounded-2xl p-4 shadow-xs border border-gray-100">
            <div class="flex items-center justify-between mb-1">
              <h2 class="text-xs font-bold uppercase tracking-wider text-gray-500">Top Riders (Sorted by Ride Count)</h2>
              <span class="text-[10px] text-blue-600 font-semibold">Tap rider for statement</span>
            </div>
            ${leaderboardHtml}
          </section>

          <!-- New Riders Joined in Period -->
          <section class="lg:col-span-5 bg-white rounded-2xl p-4 shadow-xs border border-gray-100">
            <h2 class="text-xs font-bold uppercase tracking-wider text-gray-500 mb-2">First-Time Riders (${newRidersInPeriod.length})</h2>
            ${newRidersListHtml}
          </section>
        </div>
      `;
    }

    function openRiderDrilldown(riderName) {
      const riderProfile = state.riders.find(r => r.name === riderName);
      const matchingTrips = [];
      let totalBilled = 0;
      let totalPaid = 0;

      state.rides.slice().sort((a, b) => b.date.localeCompare(a.date)).forEach(ride => {
        ride.passengers.forEach(p => {
          if (p.name === riderName) {
            const fare = Number(p.fare) || 0;
            const paid = p.paid ? (Number(p.paidAmount) || fare) : (Number(p.paidAmount) || 0);
            totalBilled += fare;
            totalPaid += paid;
            matchingTrips.push({
              rideId: ride.id,
              date: ride.date,
              time: ride.time,
              routeName: ride.routeName,
              pickup: p.pickup,
              drop: p.drop,
              fare,
              paid,
              due: Math.max(0, fare - paid),
              payMode: p.payMode || 'UPI',
              status: ride.status
            });
          }
        });
      });

      const totalDue = Math.max(0, totalBilled - totalPaid);
      const phone = riderProfile ? riderProfile.phone : (matchingTrips[0] ? matchingTrips[0].phone : '');

      const statementLines = matchingTrips.slice(0, 10).map(t =>
        `- ${formatDateDisplay(t.date)} (${t.routeName}): Rs.${t.fare} [${t.due > 0 ? 'Due Rs.' + t.due : 'Paid'}]`
      ).join('\n');

      const statementMsg = `Hi ${riderName}, here is your Carpool Summary:\nTotal Rides: ${matchingTrips.length}\nTotal Billed: Rs.${totalBilled}\nTotal Paid: Rs.${totalPaid}\nPending Balance: Rs.${totalDue}\n\nRecent Trips:\n${statementLines}\n\nUPI ID: ${state.settings.upiId}`;
      const waStatementUrl = buildWhatsAppUrl(phone, statementMsg);

      const tripRows = matchingTrips.map(t => `
        <div class="bg-gray-50 border border-gray-200/80 rounded-xl p-3 flex items-center justify-between text-xs gap-2">
          <div class="min-w-0">
            <p class="font-bold text-gray-900 truncate">${formatDateDisplay(t.date)} &bull; ${escapeHtml(t.routeName)}</p>
            <p class="text-[11px] text-gray-500 mt-0.5 truncate">${escapeHtml(t.pickup)} ${ICONS.arrowRight} ${escapeHtml(t.drop)}</p>
          </div>
          <div class="text-right shrink-0">
            <p class="font-bold text-gray-900">${formatCurrency(t.fare)}</p>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${t.due > 0 ? 'bg-red-100 text-red-600' : 'bg-emerald-100 text-emerald-700'}">
              ${t.due > 0 ? `Due ${formatCurrency(t.due)}` : `Paid (${t.payMode})`}
            </span>
          </div>
        </div>
      `).join('');

      openModal(`
        <div class="space-y-4">
          <div class="flex items-start justify-between gap-2">
            <div>
              <h3 class="text-lg font-bold text-gray-900">${escapeHtml(riderName)}</h3>
              <p class="text-xs text-gray-500">
                ${riderProfile && riderProfile.company ? escapeHtml(riderProfile.company) + ' &bull; ' : ''}
                ${phone ? '+' + phone : ''}
                ${riderProfile && riderProfile.joinedDate ? ' &bull; Joined ' + formatDateDisplay(riderProfile.joinedDate) : ''}
              </p>
              ${riderProfile && riderProfile.notes ? `<p class="text-[11px] text-blue-600 mt-0.5">${escapeHtml(riderProfile.notes)}</p>` : ''}
            </div>
            <button onclick="closeModal()" class="text-gray-400 p-1 shrink-0">${ICONS.close}</button>
          </div>

          <div class="grid grid-cols-3 gap-2 bg-gray-900 text-white rounded-2xl p-3 text-center">
            <div>
              <p class="text-[10px] text-gray-400 uppercase">Total Rides</p>
              <p class="text-base font-bold mt-0.5">${matchingTrips.length}</p>
            </div>
            <div>
              <p class="text-[10px] text-gray-400 uppercase">Total Paid</p>
              <p class="text-base font-bold text-emerald-400 mt-0.5">${formatCurrency(totalPaid)}</p>
            </div>
            <div>
              <p class="text-[10px] text-gray-400 uppercase">Pending Due</p>
              <p class="text-base font-bold ${totalDue > 0 ? 'text-orange-400' : 'text-gray-300'} mt-0.5">${formatCurrency(totalDue)}</p>
            </div>
          </div>

          <div class="space-y-2 max-h-64 overflow-y-auto">
            <p class="text-xs font-bold uppercase tracking-wider text-gray-500">All-Time Ride History</p>
            ${tripRows || '<p class="text-xs text-gray-400">No trips recorded.</p>'}
          </div>

          <a href="${waStatementUrl}" target="_blank" rel="noopener noreferrer" class="w-full bg-emerald-600 active:bg-emerald-700 text-white text-xs font-bold py-3 rounded-2xl shadow-xs flex items-center justify-center gap-1.5">
            ${ICONS.send} Send Full Statement on WhatsApp
          </a>
        </div>
      `);
    }

    function openRouteDrilldown(routeName) {
      const matchingRides = state.rides
        .filter(r => r.routeName === routeName)
        .sort((a, b) => b.date.localeCompare(a.date));

      let totalBilled = 0;
      let totalPaid = 0;
      let totalTolls = 0;
      let totalRiders = 0;

      const tripCards = matchingRides.map(r => {
        const billed = r.passengers.reduce((s, p) => s + (Number(p.fare) || 0), 0);
        const paid = r.passengers.reduce((s, p) => s + (p.paid ? (Number(p.paidAmount) || Number(p.fare)) : (Number(p.paidAmount) || 0)), 0);
        const toll = Number(r.tollCost) || 0;
        totalBilled += billed;
        totalPaid += paid;
        totalTolls += toll;
        totalRiders += r.passengers.length;

        const names = r.passengers.map(p => p.name).join(', ') || 'No riders';
        return `
          <div class="bg-gray-50 border border-gray-200/80 rounded-xl p-3 space-y-1 text-xs">
            <div class="flex justify-between font-bold text-gray-900">
              <span>${formatDateDisplay(r.date)} (${formatTime12Hr(r.time)})</span>
              <span>${formatCurrency(paid)} / ${formatCurrency(billed)}</span>
            </div>
            <p class="text-[11px] text-gray-500">Riders (${r.passengers.length}): ${escapeHtml(names)}</p>
            <p class="text-[10px] text-gray-400">Status: ${r.status.toUpperCase()} &bull; Toll: ${formatCurrency(toll)}</p>
          </div>
        `;
      }).join('');

      openModal(`
        <div class="space-y-4">
          <div class="flex items-start justify-between gap-2">
            <div>
              <h3 class="text-lg font-bold text-gray-900">${escapeHtml(routeName)}</h3>
              <p class="text-xs text-gray-500">${matchingRides.length} Total Trips &bull; ${totalRiders} Passenger Seats Filled</p>
            </div>
            <button onclick="closeModal()" class="text-gray-400 p-1 shrink-0">${ICONS.close}</button>
          </div>

          <div class="grid grid-cols-3 gap-2 bg-gray-900 text-white rounded-2xl p-3 text-center">
            <div>
              <p class="text-[10px] text-gray-400 uppercase">Collected</p>
              <p class="text-base font-bold text-emerald-400 mt-0.5">${formatCurrency(totalPaid)}</p>
            </div>
            <div>
              <p class="text-[10px] text-gray-400 uppercase">Tolls</p>
              <p class="text-base font-bold text-rose-400 mt-0.5">${formatCurrency(totalTolls)}</p>
            </div>
            <div>
              <p class="text-[10px] text-gray-400 uppercase">Net Route</p>
              <p class="text-base font-bold text-white mt-0.5">${formatCurrency(totalPaid - totalTolls)}</p>
            </div>
          </div>

          <div class="space-y-2 max-h-64 overflow-y-auto">
            <p class="text-xs font-bold uppercase tracking-wider text-gray-500">Trip Breakdown</p>
            ${tripCards}
          </div>
        </div>
      `);
    }

    function quickMarkPaid(rideId, riderId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;
      const p = ride.passengers.find(x => x.riderId === riderId);
      if (!p) return;
      p.paid = true;
      p.paidAmount = p.fare;
      saveState();
      showToast(`Marked ${p.name} as Paid!`);
    }

    /*****************************************************************
     * 8. RIDES TAB (STATUS + DATE RANGE FILTER, SCHEDULE, DISPATCH)
     *****************************************************************/
    function setRidesStatusFilter(f) {
      ridesStatusFilter = f;
      renderApp();
    }

    function setRidesPeriodFilter(p) {
      ridesPeriodFilter = p;
      renderApp();
    }

    function renderRides() {
      const sorted = [...state.rides].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
      const list = sorted.filter(r => {
        const statusMatch = ridesStatusFilter === 'upcoming'
          ? (r.status === 'scheduled' || r.status === 'active')
          : ridesStatusFilter === 'completed'
            ? r.status === 'completed'
            : true;
        const periodMatch = isDateInPeriod(r.date, ridesPeriodFilter);
        return statusMatch && periodMatch;
      });

      const ridePeriodOptions = [
        { id: 'all', label: 'All Dates' },
        { id: 'today', label: 'Today' },
        { id: 'week', label: 'Week' },
        { id: 'month', label: 'Month' },
        { id: 'quarter', label: 'Quarter' },
        { id: 'year', label: 'Year' }
      ];

      const periodPills = ridePeriodOptions.map(p => `
        <button onclick="setRidesPeriodFilter('${p.id}')" class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${ridesPeriodFilter === p.id ? 'bg-blue-600 text-white shadow-xs' : 'bg-white text-gray-600 border border-gray-200/80 hover:bg-gray-50'}">
          ${p.label}
        </button>
      `).join('');

      const filterBar = `
        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-2.5">
          <div class="grid grid-cols-3 bg-gray-200/80 p-1 rounded-xl text-xs font-semibold w-full md:w-80">
            <button onclick="setRidesStatusFilter('upcoming')" class="py-1.5 rounded-lg transition ${ridesStatusFilter === 'upcoming' ? 'bg-white text-gray-900 shadow-xs' : 'text-gray-600'}">Active &amp; Next</button>
            <button onclick="setRidesStatusFilter('completed')" class="py-1.5 rounded-lg transition ${ridesStatusFilter === 'completed' ? 'bg-white text-gray-900 shadow-xs' : 'text-gray-600'}">Completed</button>
            <button onclick="setRidesStatusFilter('all')" class="py-1.5 rounded-lg transition ${ridesStatusFilter === 'all' ? 'bg-white text-gray-900 shadow-xs' : 'text-gray-600'}">All (${state.rides.length})</button>
          </div>
          <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
            ${periodPills}
          </div>
        </div>
      `;

      if (list.length === 0) {
        return `
          ${filterBar}
          <div class="bg-white rounded-2xl p-8 text-center border border-gray-100 space-y-2">
            <p class="text-sm font-semibold text-gray-700">No rides found for this filter</p>
            <p class="text-xs text-gray-400">Try switching the date range above or tap "+ Schedule" to create a ride.</p>
          </div>
        `;
      }

      const cards = list.map(ride => {
        const routeObj = state.routes.find(rt => rt.id === ride.routeId);
        const capacity = ride.capacity || (routeObj ? routeObj.capacity : 4);
        const seatsLeft = Math.max(0, capacity - ride.passengers.length);
        const totalFare = ride.passengers.reduce((s, p) => s + (Number(p.fare) || 0), 0);
        const totalPaid = ride.passengers.reduce((s, p) => s + (p.paid ? (Number(p.paidAmount) || Number(p.fare)) : (Number(p.paidAmount) || 0)), 0);

        let badgeClass = 'bg-blue-50 text-blue-600';
        let badgeText = 'Scheduled';
        if (ride.status === 'active') {
          badgeClass = 'bg-amber-100 text-amber-700';
          badgeText = 'In Progress';
        } else if (ride.status === 'completed') {
          badgeClass = 'bg-emerald-50 text-emerald-700';
          badgeText = 'Completed';
        }

        const passengerRows = ride.passengers.length === 0
          ? `<div class="py-3 text-center text-xs text-gray-400 border-t border-gray-50">No riders added yet &bull; <button onclick="openRideFormModal('${ride.id}')" class="text-blue-600 font-semibold underline">+ Add Riders</button></div>`
          : ride.passengers.map(p => `
              <div class="flex items-center justify-between py-1.5 text-xs border-t border-gray-50 gap-2">
                <div class="min-w-0">
                  <span class="font-semibold text-gray-800 block truncate">${escapeHtml(p.name)}</span>
                  <span class="text-gray-400 block text-[11px] truncate">${escapeHtml(p.pickup)} ${ICONS.arrowRight} ${escapeHtml(p.drop)}</span>
                </div>
                <div class="text-right shrink-0">
                  <span class="font-bold text-gray-900">${formatCurrency(p.fare)}</span>
                  ${ride.status === 'completed'
                    ? `<span class="block text-[10px] font-semibold ${p.paid && p.paidAmount >= p.fare ? 'text-emerald-600' : 'text-red-500'}">${p.paid && p.paidAmount >= p.fare ? 'Paid' : `Due ${formatCurrency(Math.max(0, p.fare - (p.paidAmount || 0)))}`}</span>`
                    : ''}
                </div>
              </div>
            `).join('');

        let actionButtons = '';
        if (ride.status === 'scheduled') {
          actionButtons = `
            <div class="space-y-2 pt-2 border-t border-gray-100">
              <div class="flex items-center gap-2">
                <button onclick="startRide('${ride.id}')" class="flex-1 bg-emerald-600 active:bg-emerald-700 text-white text-xs font-semibold py-2.5 px-2 rounded-xl shadow-xs flex items-center justify-center gap-1.5">
                  ${ICONS.play} <span>Start &amp; Notify</span>
                </button>
                <button onclick="openAdminPostModal('${ride.id}')" class="bg-indigo-50 active:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-semibold px-3 py-2.5 rounded-xl shrink-0">
                  Admin Post
                </button>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="openRideFormModal('${ride.id}')" class="flex-1 bg-gray-100 active:bg-gray-200 text-gray-800 text-[11px] font-semibold py-2 px-2 rounded-xl flex items-center justify-center gap-1">
                  ${ICONS.edit} <span>Edit</span>
                </button>
                <button onclick="openRideUpdatesModal('${ride.id}')" class="flex-1 bg-amber-50 active:bg-amber-100 text-amber-800 border border-amber-200 text-[11px] font-semibold py-2 px-2 rounded-xl">
                  Updates
                </button>
                <button onclick="cloneRide('${ride.id}')" class="bg-gray-100 text-gray-700 text-[11px] font-semibold px-2.5 py-2 rounded-xl shrink-0">
                  Repeat
                </button>
                <button onclick="deleteRide('${ride.id}')" class="bg-red-50 text-red-600 p-2 rounded-xl flex items-center justify-center shrink-0" aria-label="Delete">
                  ${ICONS.trash}
                </button>
              </div>
            </div>
          `;
        } else if (ride.status === 'active') {
          actionButtons = `
            <div class="flex items-center gap-1.5 pt-2 border-t border-gray-100">
              <button onclick="openLiveLocationModal('${ride.id}')" class="flex-1 bg-blue-600 active:bg-blue-700 text-white text-xs font-semibold py-2.5 px-2 rounded-xl shadow-xs flex items-center justify-center gap-1">
                ${ICONS.pin} <span>Live Map</span>
              </button>
              <button onclick="openRideFormModal('${ride.id}')" class="bg-gray-100 text-gray-800 text-xs font-semibold px-2.5 py-2.5 rounded-xl shrink-0">
                Edit
              </button>
              <button onclick="endRide('${ride.id}')" class="flex-1 bg-gray-900 active:bg-gray-800 text-white text-xs font-semibold py-2.5 px-2 rounded-xl shadow-xs flex items-center justify-center gap-1">
                ${ICONS.stop} <span>End &amp; Settle</span>
              </button>
            </div>
          `;
        } else {
          actionButtons = `
            <div class="flex items-center gap-1.5 pt-2 border-t border-gray-100">
              <button onclick="openSettlementModal('${ride.id}')" class="flex-1 bg-blue-50 active:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-semibold py-2 px-2 rounded-xl flex items-center justify-center gap-1 truncate">
                ${ICONS.check} <span>${formatCurrency(totalPaid)}/${formatCurrency(totalFare)}</span>
              </button>
              <button onclick="openRideFormModal('${ride.id}')" class="bg-gray-100 text-gray-800 text-xs font-semibold px-2.5 py-2 rounded-xl shrink-0">
                Edit
              </button>
              <button onclick="cloneRide('${ride.id}')" class="bg-gray-100 text-gray-700 text-xs font-semibold px-2.5 py-2 rounded-xl shrink-0">
                Repeat
              </button>
              <button onclick="deleteRide('${ride.id}')" class="bg-red-50 text-red-600 p-2 rounded-xl flex items-center justify-center shrink-0" aria-label="Delete">
                ${ICONS.trash}
              </button>
            </div>
          `;
        }

        return `
          <div class="bg-white rounded-2xl p-4 shadow-xs border border-gray-100 flex flex-col justify-between space-y-2.5">
            <div class="space-y-2.5">
              <div class="flex items-start justify-between gap-2">
                <div class="min-w-0">
                  <h3 class="font-bold text-base text-gray-900 truncate">${escapeHtml(ride.routeName)}</h3>
                  <p class="text-xs text-gray-500 mt-0.5">${formatDateDisplay(ride.date)} at ${formatTime12Hr(ride.time)}</p>
                  <p class="text-[11px] text-gray-400 mt-0.5">
                    Seats: ${ride.passengers.length}/${capacity} (${seatsLeft} avail) &bull; Toll: ${formatCurrency(ride.tollCost || 0)}
                  </p>
                </div>
                <span class="text-[11px] font-bold px-2.5 py-1 rounded-full shrink-0 ${badgeClass}">${badgeText}</span>
              </div>

              <div class="space-y-0.5">
                ${passengerRows}
              </div>
            </div>

            ${actionButtons}
          </div>
        `;
      }).join('');

      return `${filterBar}<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">${cards}</div>`;
    }

    function startRide(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;
      ride.status = 'active';
      saveState();
      if (ride.passengers.length > 0) {
        initSingleButtonDispatch(rideId, 'start');
      } else {
        showToast('Ride started! (No riders added yet)');
      }
    }

    function endRide(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;
      ride.status = 'completed';
      ride.passengers.forEach(p => {
        if (p.paidAmount === 0 && !p.paid) {
          p.paidAmount = p.fare;
        }
      });
      saveState();
      openSettlementModal(rideId);
    }

    function cloneRide(rideId) {
      const orig = state.rides.find(r => r.id === rideId);
      if (!orig) return;
      const cloned = {
        id: 'ride_' + Date.now(),
        routeId: orig.routeId,
        routeName: orig.routeName,
        fromPoint: orig.fromPoint || '',
        toPoint: orig.toPoint || '',
        date: todayStr(),
        time: orig.time,
        capacity: orig.capacity || 4,
        tollCost: orig.tollCost || 0,
        status: 'scheduled',
        liveMapLink: '',
        passengers: orig.passengers.map(p => ({
          ...p,
          paid: false,
          paidAmount: 0
        }))
      };
      state.rides.unshift(cloned);
      ridesStatusFilter = 'upcoming';
      saveState();
      showToast(`Repeated "${orig.routeName}" for today!`);
    }

    function deleteRide(rideId) {
      if (!confirm('Delete this ride permanently?')) return;
      state.rides = state.rides.filter(r => r.id !== rideId);
      saveState();
      showToast('Ride deleted');
    }

    /*****************************************************************
     * 9. WHATSAPP + IPHONE SHORTCUT BATCH DISPATCH & ADMIN SEAT POST
     *****************************************************************/
    function openAdminPostModal(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;
      const routeObj = state.routes.find(rt => rt.id === ride.routeId);
      const capacity = ride.capacity || (routeObj ? routeObj.capacity : 4);
      const seatsAvail = Math.max(0, capacity - ride.passengers.length);

      const fromLoc = ride.fromPoint || (routeObj ? routeObj.fromPoint : (ride.passengers[0] ? ride.passengers[0].pickup : 'Origin'));
      const toLoc = ride.toPoint || (routeObj ? routeObj.toPoint : (ride.passengers[0] ? ride.passengers[0].drop : 'Destination'));
      const rideHeaderTitle = ride.routeName.toUpperCase().includes('RIDE')
        ? `${ride.routeName.toUpperCase()} AVAILABLE`
        : `${ride.routeName.toUpperCase()} RIDE AVAILABLE`;

      const postText =
`${EMOJI.car} ${rideHeaderTitle} ${EMOJI.car}

${EMOJI.user} Name: ${state.settings.driverName || 'Driver'}
${EMOJI.cal} Date: ${formatDateDisplay(ride.date)}
${EMOJI.clock} Start Time: ${formatTime12Hr(ride.time)}

${EMOJI.pin} From: ${fromLoc}
${EMOJI.pin} To: ${toLoc}

${EMOJI.seat} Seats Available: ${seatsAvail}

${EMOJI.phone} Contact: ${state.settings.driverPhone || ''}

${EMOJI.sedan} Vehicle: ${state.settings.vehicleInfo || ''}
${EMOJI.point} Interested? WhatsApp me directly for booking.

${EMOJI.pray} Thank you! Have a safe ride! ${EMOJI.smile}`;

      const waUrl = buildWhatsAppUrl(state.settings.adminPhone || '', postText);

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">WhatsApp Admin Seat Post</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>

          <textarea id="adminPostTextarea" rows="12" class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3 text-xs font-mono leading-relaxed">${postText}</textarea>

          <div class="grid grid-cols-2 gap-2.5">
            <button onclick="copyAdminPostText()" class="bg-gray-100 active:bg-gray-200 text-gray-800 text-xs font-bold py-3 rounded-2xl">
              Copy Post Text
            </button>
            <a id="adminWaLink" href="${waUrl}" target="_blank" rel="noopener noreferrer" onclick="updateAdminWaHref()" class="bg-emerald-600 active:bg-emerald-700 text-white text-xs font-bold py-3 rounded-2xl shadow-xs flex items-center justify-center gap-1.5">
              ${ICONS.send} Send to Admin
            </a>
          </div>
        </div>
      `);
    }

    function updateAdminWaHref() {
      const txt = document.getElementById('adminPostTextarea').value;
      document.getElementById('adminWaLink').href = buildWhatsAppUrl(state.settings.adminPhone || '', txt);
    }

    function copyAdminPostText() {
      const el = document.getElementById('adminPostTextarea');
      el.select();
      navigator.clipboard.writeText(el.value).then(() => showToast('Admin post copied!'));
    }

    function openRideUpdatesModal(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;
      if (ride.passengers.length === 0) {
        alert('No riders are added to this ride yet.');
        return;
      }

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">Send Ride Update to Riders</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>

          <button onclick="initSingleButtonDispatch('${ride.id}', 'timeUpdate')" class="w-full text-left bg-blue-50 active:bg-blue-100 border border-blue-200 rounded-2xl p-3.5 space-y-1">
            <p class="text-sm font-bold text-blue-900">1. Ride Time Updated (${formatTime12Hr(ride.time)})</p>
            <p class="text-[11px] text-blue-700">Auto-send or queue the updated start time to all riders.</p>
          </button>

          <button onclick="initSingleButtonDispatch('${ride.id}', 'cancelled')" class="w-full text-left bg-red-50 active:bg-red-100 border border-red-200 rounded-2xl p-3.5 space-y-1">
            <p class="text-sm font-bold text-red-900">2. Ride Cancelled Notice</p>
            <p class="text-[11px] text-red-700">Notifies all riders that today's ride is cancelled.</p>
          </button>

          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3.5 space-y-2">
            <p class="text-sm font-bold text-gray-900">3. Custom Quick Note</p>
            <input type="text" id="customRideNoteInput" placeholder="e.g. Stuck in traffic, running 10 mins late" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs">
            <button onclick="sendCustomNoteToRiders('${ride.id}')" class="w-full bg-gray-900 text-white text-xs font-bold py-2.5 rounded-xl">
              Prepare Custom Note for All
            </button>
          </div>
        </div>
      `);
    }

    function sendCustomNoteToRiders(rideId) {
      const note = document.getElementById('customRideNoteInput').value.trim();
      if (!note) {
        alert('Please type a message first.');
        return;
      }
      initSingleButtonDispatch(rideId, 'custom', '', note);
    }

    function initSingleButtonDispatch(rideId, mode, extraLink = '', customNote = '') {
      batchQueue = {
        rideId,
        mode,
        index: 0,
        extraLink,
        customNote
      };
      renderSingleButtonDispatchModal();
    }

    function renderSingleButtonDispatchModal() {
      const ride = state.rides.find(r => r.id === batchQueue.rideId);
      if (!ride || ride.passengers.length === 0) return;

      const total = ride.passengers.length;
      const idx = batchQueue.index;
      const isDone = idx >= total;
      const currentPassenger = isDone ? ride.passengers[total - 1] : ride.passengers[idx];

      const titles = {
        start: 'Notify Riders (Ride Started)',
        end: 'Send Thank You to Riders',
        location: 'Send Live Location to Riders',
        timeUpdate: 'Send Time Update to Riders',
        cancelled: 'Send Cancellation to Riders',
        custom: 'Send Custom Update to Riders'
      };

      const buildMsgForPassenger = (p) => {
        const vars = {
          name: p.name,
          rideName: ride.routeName,
          pickup: p.pickup,
          drop: p.drop,
          amount: p.fare,
          date: formatDateDisplay(ride.date),
          time: formatTime12Hr(ride.time)
        };
        if (batchQueue.mode === 'start') return compileMessage(state.settings.msgStart, vars);
        if (batchQueue.mode === 'end') return compileMessage(state.settings.msgEnd, vars);
        if (batchQueue.mode === 'timeUpdate') return compileMessage(state.settings.msgTimeUpdate, vars);
        if (batchQueue.mode === 'cancelled') return compileMessage(state.settings.msgCancelled, vars);
        if (batchQueue.mode === 'custom') return `Hi ${p.name} (${ride.routeName}): ${batchQueue.customNote}`;
        return `Hi ${p.name}, follow my live moving location for ${ride.routeName} here: ${batchQueue.extraLink}`;
      };

      // Build iPhone Shortcut JSON payload for ALL riders at once
      const shortcutBatchItems = ride.passengers
        .filter(p => p.phone)
        .map(p => ({
          phone: normalizePhonePlus(p.phone),
          msg: buildMsgForPassenger(p)
        }));
      const shortcutUrl = buildShortcutBatchUrl(shortcutBatchItems);

      const previewMsg = buildMsgForPassenger(currentPassenger);
      const waUrl = buildWhatsAppUrl(currentPassenger.phone, previewMsg);

      const groupMsg = buildMsgForPassenger({
        name: 'Everyone',
        pickup: 'your pickup points',
        drop: '',
        fare: ''
      });
      const groupShareUrl = state.settings.groupLink
        ? `https://wa.me/?text=${encodeURIComponent(groupMsg)}`
        : '';

      const progressPills = ride.passengers.map((p, i) => {
        let style = 'bg-gray-100 text-gray-500';
        if (i < idx) style = 'bg-emerald-100 text-emerald-700 font-bold';
        else if (i === idx && !isDone) style = 'bg-blue-600 text-white font-bold';
        return `<span class="text-[11px] px-2.5 py-1 rounded-full ${style}">${i < idx ? 'Sent: ' : ''}${escapeHtml(p.name.split(' ')[0])}</span>`;
      }).join('');

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">${titles[batchQueue.mode] || 'Notify Riders'}</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>

          <!-- PRIMARY: 1-Tap iPhone Shortcut Auto-Send -->
          <div class="bg-indigo-50 border border-indigo-200 rounded-2xl p-3.5 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-bold uppercase tracking-wider text-indigo-800">iPhone Auto-Send (All ${total} Riders)</span>
              <span class="text-[10px] font-semibold bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full">Shortcut: CarpoolNotify</span>
            </div>
            <a href="${shortcutUrl}" class="w-full bg-indigo-600 active:bg-indigo-700 text-white text-sm font-bold py-3 rounded-xl shadow-xs flex items-center justify-center gap-1.5">
              ${ICONS.bolt} Auto-Send All via iPhone Shortcut
            </a>
            <p class="text-[10px] text-indigo-700 leading-snug">Sends personalized WhatsApp messages to all ${total} saved contacts automatically. <button type="button" onclick="closeModal(); switchTab('setup'); setSetupSubTab('templates');" class="underline font-semibold">View Shortcut setup</button></p>
          </div>

          <!-- FALLBACK: Step-by-Step Manual Queue (Android / Desktop / Unsaved Numbers) -->
          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3.5 space-y-2.5">
            <div class="flex items-center justify-between">
              <p class="text-[11px] font-semibold text-gray-500 uppercase">Manual Fallback (${isDone ? 'All Sent' : `Rider ${idx + 1} of ${total}: ${escapeHtml(currentPassenger.name)}`})</p>
            </div>
            <div class="flex flex-wrap gap-1.5">
              ${progressPills}
            </div>
            <p class="text-xs text-gray-800 bg-white p-2.5 rounded-xl border border-gray-100 select-all">${escapeHtml(previewMsg)}</p>

            ${!isDone ? `
              <a href="${waUrl}" target="_blank" rel="noopener noreferrer" onclick="advanceSingleButtonQueue()" class="w-full bg-emerald-600 active:bg-emerald-700 text-white text-xs font-bold py-3 rounded-xl shadow-xs flex items-center justify-center gap-1.5">
                ${ICONS.send} Manual Send to ${escapeHtml(currentPassenger.name)} (${idx + 1}/${total})
              </a>
            ` : `
              <button onclick="closeModal()" class="w-full bg-gray-900 text-white text-xs font-bold py-3 rounded-xl">
                All ${total} Riders Notified &mdash; Done
              </button>
            `}
          </div>

          ${groupShareUrl ? `
            <div class="text-center">
              <a href="${groupShareUrl}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold text-blue-600">
                Or pick your Carpool WhatsApp Group to send once &rarr;
              </a>
            </div>
          ` : ''}
        </div>
      `);
    }

    function advanceSingleButtonQueue() {
      setTimeout(() => {
        batchQueue.index += 1;
        renderSingleButtonDispatchModal();
      }, 450);
    }

    function openLiveLocationModal(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">Share Moving Live Location</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>

          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3.5 space-y-2.5">
            <p class="text-xs font-bold text-gray-900">Option 1: Google / Apple Maps Live Trip Link</p>
            <p class="text-[11px] text-gray-500">1. Start navigation in Google Maps or Apple Maps &rarr; tap <strong>Share Trip Progress</strong> &rarr; Copy Link.<br>2. Paste below to auto-send your real-time moving route to all riders:</p>
            <input type="url" id="liveTripUrlInput" value="${escapeHtml(ride.liveMapLink || '')}" placeholder="Paste maps.app.goo.gl/... live link here" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs">
            <button onclick="sendPastedLiveLink('${ride.id}')" class="w-full bg-blue-600 active:bg-blue-700 text-white text-xs font-bold py-2.5 rounded-xl shadow-xs">
              Send Live Trip Link to All Riders
            </button>
          </div>

          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3.5 space-y-2">
            <p class="text-xs font-bold text-gray-900">Option 2: WhatsApp Native Live Location</p>
            <p class="text-[11px] text-gray-500">Opens WhatsApp directly so you can tap <strong>+ &rarr; Location &rarr; Share Live Location</strong> inside your group/chat:</p>
            <a href="https://wa.me/" target="_blank" rel="noopener noreferrer" class="w-full bg-emerald-600 active:bg-emerald-700 text-white text-xs font-bold py-2.5 rounded-xl flex items-center justify-center gap-1.5">
              Open WhatsApp App
            </a>
          </div>
        </div>
      `);
    }

    function sendPastedLiveLink(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;
      const url = document.getElementById('liveTripUrlInput').value.trim();
      if (!url) {
        alert('Please paste your Google Maps or Apple Maps live trip link first.');
        return;
      }
      ride.liveMapLink = url;
      saveState();
      initSingleButtonDispatch(rideId, 'location', url);
    }

    /*****************************************************************
     * 10. UNIFIED RIDE SCHEDULER / EDITOR (SEARCHABLE + FREQUENT RIDER SORT + OVERLAP-FREE)
     *****************************************************************/
    function openModal(html) {
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
    }

    function openRideFormModal(editRideId = null) {
      if (state.routes.length === 0) {
        alert('Please add at least one Route in Setup -> Routes DB first.');
        switchTab('setup');
        return;
      }

      const existing = editRideId ? state.rides.find(r => r.id === editRideId) : null;
      const defaultRoute = existing
        ? (state.routes.find(rt => rt.id === existing.routeId) || state.routes[0])
        : state.routes[0];

      const routeOptions = state.routes.map(rt => `
        <option value="${rt.id}"
          data-time="${rt.defaultTime}"
          data-toll="${rt.defaultToll || 0}"
          data-from="${escapeHtml(rt.fromPoint || '')}"
          data-to="${escapeHtml(rt.toPoint || '')}"
          data-cap="${rt.capacity || 4}"
          data-return="${rt.isReturn ? '1' : '0'}"
          ${defaultRoute && rt.id === defaultRoute.id ? 'selected' : ''}>
          ${escapeHtml(rt.name)} ${rt.isReturn ? '(Return Swap)' : ''}
        </option>
      `).join('');

      // Sort riders by ride frequency (most frequent first), then already-selected, then name
      const freqMap = getRiderRideFrequencyMap();
      const sortedRiders = [...state.riders].sort((a, b) => {
        const aFreq = freqMap[a.id] || freqMap['name:' + a.name] || 0;
        const bFreq = freqMap[b.id] || freqMap['name:' + b.name] || 0;
        if (bFreq !== aFreq) return bFreq - aFreq;
        return a.name.localeCompare(b.name);
      });

      const riderCheckboxes = sortedRiders.map(r => {
        const existingP = existing ? existing.passengers.find(p => p.riderId === r.id) : null;
        const isChecked = !!existingP;
        const rideCount = freqMap[r.id] || freqMap['name:' + r.name] || 0;

        const autoSwap = !existing && defaultRoute && defaultRoute.isReturn;
        const initPickup = existingP ? existingP.pickup : (autoSwap ? r.drop : r.pickup);
        const initDrop = existingP ? existingP.drop : (autoSwap ? r.pickup : r.drop);
        const initFare = existingP ? existingP.fare : r.defaultFare;
        const initPaid = existingP ? existingP.paid : false;
        const initPaidAmt = existingP ? existingP.paidAmount : r.defaultFare;
        const initPayMode = existingP ? (existingP.payMode || 'UPI') : 'UPI';

        const searchTokens = `${r.name} ${r.company || ''} ${initPickup} ${initDrop}`.toLowerCase();

        return `
          <div class="sched-rider-card border border-gray-200 rounded-2xl p-3 space-y-2 bg-gray-50/70" data-search="${escapeHtml(searchTokens)}">
            <div class="flex items-center justify-between gap-2">
              <label class="flex items-center gap-2.5 cursor-pointer flex-1 min-w-0">
                <input type="checkbox" class="sched-rider-cb w-5 h-5 rounded accent-blue-600 shrink-0" value="${r.id}" ${isChecked ? 'checked' : ''} onchange="toggleRiderOverride('${r.id}', this.checked)">
                <div class="min-w-0">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    <p class="text-sm font-bold text-gray-900 truncate">${escapeHtml(r.name)}</p>
                    ${rideCount > 0 ? `<span class="text-[10px] font-bold bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded-full shrink-0">${EMOJI.star} ${rideCount} ride${rideCount > 1 ? 's' : ''}</span>` : ''}
                    ${r.company ? `<span class="text-[10px] font-medium text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded shrink-0">${escapeHtml(r.company)}</span>` : ''}
                  </div>
                  <p class="text-[11px] text-gray-500 truncate mt-0.5">${escapeHtml(initPickup)} ${ICONS.arrowRight} ${escapeHtml(initDrop)}</p>
                </div>
              </label>
              <span class="text-xs font-bold text-blue-600 shrink-0">${formatCurrency(initFare)}</span>
            </div>

            <div id="override_${r.id}" class="${isChecked ? '' : 'hidden'} space-y-2 pt-2 border-t border-gray-200/80">
              <div class="flex items-center gap-1.5">
                <input type="text" id="ov_pickup_${r.id}" value="${escapeHtml(initPickup)}" class="flex-1 min-w-0 bg-white border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs" placeholder="Pickup">
                <button type="button" onclick="swapSingleRiderPoints('${r.id}')" class="bg-gray-200 text-gray-700 p-1.5 rounded-lg shrink-0" title="Swap Pickup & Drop">${ICONS.swap}</button>
                <input type="text" id="ov_drop_${r.id}" value="${escapeHtml(initDrop)}" class="flex-1 min-w-0 bg-white border border-gray-200 rounded-lg px-2.5 py-1.5 text-xs" placeholder="Drop">
              </div>
              <div class="grid grid-cols-3 gap-2 items-center">
                <div class="min-w-0">
                  <span class="text-[10px] text-gray-500 uppercase block mb-0.5">Fare (${RS})</span>
                  <input type="number" id="ov_fare_${r.id}" value="${initFare}" class="w-full bg-white border border-gray-200 rounded-lg px-2 py-1.5 text-xs font-bold">
                </div>
                <div class="min-w-0">
                  <span class="text-[10px] text-gray-500 uppercase block mb-0.5">Paid?</span>
                  <label class="flex items-center gap-1.5 bg-white border border-gray-200 rounded-lg px-2 py-1.5 text-xs font-semibold cursor-pointer">
                    <input type="checkbox" id="ov_paid_${r.id}" ${initPaid ? 'checked' : ''} class="accent-emerald-600"> Paid
                  </label>
                </div>
                <div class="min-w-0">
                  <span class="text-[10px] text-gray-500 uppercase block mb-0.5">Paid Amt</span>
                  <input type="number" id="ov_paidamt_${r.id}" value="${initPaidAmt}" class="w-full bg-white border border-gray-200 rounded-lg px-2 py-1.5 text-xs">
                </div>
              </div>
              <input type="hidden" id="ov_paymode_${r.id}" value="${initPayMode}">
            </div>
          </div>
        `;
      }).join('');

      const initFrom = existing ? (existing.fromPoint || '') : (defaultRoute.fromPoint || '');
      const initTo = existing ? (existing.toPoint || '') : (defaultRoute.toPoint || '');
      const initToll = existing ? (existing.tollCost ?? 0) : (defaultRoute.defaultToll || 0);
      const initCap = existing ? (existing.capacity || 4) : (defaultRoute.capacity || 4);
      const initStatus = existing ? existing.status : 'scheduled';
      const selectedCount = existing ? existing.passengers.length : 0;

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">${existing ? 'Edit / Manage Ride' : 'Schedule or Log Ride'}</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>

          <!-- Row 1: Route & Status (2 Clean Columns) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Ride Name / Route</label>
              <select id="schedRoute" onchange="onSchedRouteChange()" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs font-semibold outline-none">
                ${routeOptions}
              </select>
            </div>
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Ride Status</label>
              <select id="schedStatus" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs font-semibold outline-none">
                <option value="scheduled" ${initStatus === 'scheduled' ? 'selected' : ''}>Scheduled (Upcoming)</option>
                <option value="active" ${initStatus === 'active' ? 'selected' : ''}>In Progress</option>
                <option value="completed" ${initStatus === 'completed' ? 'selected' : ''}>Completed (Past Ride)</option>
              </select>
            </div>
          </div>

          <!-- Row 2: From / Swap / To -->
          <div class="flex items-end gap-2">
            <div class="flex-1 min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">From</label>
              <input type="text" id="schedFrom" value="${escapeHtml(initFrom)}" placeholder="Origin" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
            <button type="button" onclick="swapAllRidePoints()" class="bg-blue-50 text-blue-600 border border-blue-200 p-2.5 rounded-xl shrink-0" title="Swap From/To & All Riders">${ICONS.swap}</button>
            <div class="flex-1 min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">To</label>
              <input type="text" id="schedTo" value="${escapeHtml(initTo)}" placeholder="Destination" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
          </div>

          <!-- Row 3: Date & Start Time (2 Clean Columns - Overlap Free on iOS) -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Ride Date</label>
              <input type="date" id="schedDate" value="${existing ? existing.date : todayStr()}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Start Time</label>
              <input type="time" id="schedTime" value="${existing ? existing.time : defaultRoute.defaultTime}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
          </div>

          <!-- Row 4: Default Toll & Seat Capacity (2 Clean Columns) -->
          <div class="grid grid-cols-2 gap-3">
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Default Toll (${RS})</label>
              <input type="number" id="schedToll" value="${initToll}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs font-bold">
            </div>
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Seat Capacity</label>
              <input type="number" id="schedCap" value="${initCap}" onchange="updateSeatBadge()" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs font-bold">
            </div>
          </div>

          <!-- Row 5: Searchable Frequent Riders List -->
          <div class="space-y-2 pt-1">
            <div class="flex justify-between items-center">
              <label class="text-xs font-semibold text-gray-700">Select Riders (Sorted by Frequency)</label>
              <span id="seatCounterBadge" class="text-[11px] font-bold text-blue-600">${selectedCount} / ${initCap} seats</span>
            </div>

            <div class="relative">
              <span class="absolute left-3 top-2.5">${ICONS.search}</span>
              <input type="text" id="schedRiderSearch" oninput="filterSchedRiders()" placeholder="Search rider name, company, pickup or drop..." class="w-full bg-gray-100 border border-gray-200 rounded-xl pl-9 pr-3 py-2 text-xs outline-none focus:border-blue-500">
            </div>

            <div id="schedRidersList" class="space-y-2 max-h-56 overflow-y-auto pr-0.5">
              ${riderCheckboxes || '<p class="text-xs text-gray-400 text-center py-3">No riders in DB yet. You can still schedule now and add riders later.</p>'}
            </div>
          </div>

          <button onclick="saveRideForm('${editRideId || ''}')" class="w-full bg-blue-600 active:bg-blue-700 text-white text-sm font-semibold py-3 rounded-2xl shadow-sm">
            ${existing ? 'Update Ride Details' : 'Save Ride'}
          </button>
        </div>
      `);

    function filterSchedRiders() {
      const q = (document.getElementById('schedRiderSearch').value || '').toLowerCase().trim();
      const cards = document.querySelectorAll('.sched-rider-card');
      cards.forEach(card => {
        const hay = card.dataset.search || '';
        card.style.display = !q || hay.includes(q) ? '' : 'none';
      });
    }

    function updateSeatBadge() {
      const count = document.querySelectorAll('.sched-rider-cb:checked').length;
      const cap = document.getElementById('schedCap').value || 4;
      document.getElementById('seatCounterBadge').textContent = `${count} / ${cap} seats`;
    }

    function onSchedRouteChange() {
      const sel = document.getElementById('schedRoute');
      const opt = sel.options[sel.selectedIndex];
      if (!opt) return;
      document.getElementById('schedTime').value = opt.dataset.time || '08:30';
      document.getElementById('schedToll').value = opt.dataset.toll || '0';
      document.getElementById('schedFrom').value = opt.dataset.from || '';
      document.getElementById('schedTo').value = opt.dataset.to || '';
      document.getElementById('schedCap').value = opt.dataset.cap || '4';
      updateSeatBadge();

      const isReturn = opt.dataset.return === '1';
      state.riders.forEach(r => {
        const pEl = document.getElementById(`ov_pickup_${r.id}`);
        const dEl = document.getElementById(`ov_drop_${r.id}`);
        if (pEl && dEl) {
          pEl.value = isReturn ? r.drop : r.pickup;
          dEl.value = isReturn ? r.pickup : r.drop;
        }
      });
    }

    function swapSingleRiderPoints(riderId) {
      const pEl = document.getElementById(`ov_pickup_${riderId}`);
      const dEl = document.getElementById(`ov_drop_${riderId}`);
      if (pEl && dEl) {
        const tmp = pEl.value;
        pEl.value = dEl.value;
        dEl.value = tmp;
      }
    }

    function swapAllRidePoints() {
      const fEl = document.getElementById('schedFrom');
      const tEl = document.getElementById('schedTo');
      if (fEl && tEl) {
        const tmp = fEl.value;
        fEl.value = tEl.value;
        tEl.value = tmp;
      }
      state.riders.forEach(r => swapSingleRiderPoints(r.id));
      showToast('Swapped Pickup & Drop points!');
    }

    function toggleRiderOverride(riderId, checked) {
      const box = document.getElementById(`override_${riderId}`);
      if (checked) box.classList.remove('hidden');
      else box.classList.add('hidden');
      updateSeatBadge();
    }

    function saveRideForm(editRideId) {
      const routeId = document.getElementById('schedRoute').value;
      const routeObj = state.routes.find(r => r.id === routeId);
      const status = document.getElementById('schedStatus').value;
      const fromPoint = document.getElementById('schedFrom').value.trim();
      const toPoint = document.getElementById('schedTo').value.trim();
      const date = document.getElementById('schedDate').value || todayStr();
      const time = document.getElementById('schedTime').value || '08:30';
      const tollCost = parseFloat(document.getElementById('schedToll').value) || 0;
      const capacity = parseInt(document.getElementById('schedCap').value, 10) || (routeObj ? routeObj.capacity : 4);

      const checkedBoxes = Array.from(document.querySelectorAll('.sched-rider-cb:checked'));
      const passengers = checkedBoxes.map(cb => {
        const rid = cb.value;
        const base = state.riders.find(r => r.id === rid);
        const fare = parseFloat(document.getElementById(`ov_fare_${rid}`).value) || base.defaultFare;
        const isPaid = document.getElementById(`ov_paid_${rid}`).checked;
        const paidAmt = parseFloat(document.getElementById(`ov_paidamt_${rid}`).value) || 0;
        const payMode = document.getElementById(`ov_paymode_${rid}`).value || 'UPI';

        return {
          riderId: rid,
          name: base.name,
          phone: base.phone,
          company: base.company || '',
          pickup: document.getElementById(`ov_pickup_${rid}`).value.trim() || base.pickup,
          drop: document.getElementById(`ov_drop_${rid}`).value.trim() || base.drop,
          fare,
          paid: isPaid,
          paidAmount: isPaid ? (paidAmt > 0 ? paidAmt : fare) : 0,
          payMode
        };
      });

      if (editRideId) {
        const idx = state.rides.findIndex(r => r.id === editRideId);
        if (idx !== -1) {
          state.rides[idx] = {
            ...state.rides[idx],
            routeId,
            routeName: routeObj ? routeObj.name : state.rides[idx].routeName,
            fromPoint,
            toPoint,
            date,
            time,
            capacity,
            tollCost,
            status,
            passengers
          };
        }
        showToast('Ride updated!');
      } else {
        state.rides.unshift({
          id: 'ride_' + Date.now(),
          routeId,
          routeName: routeObj ? routeObj.name : 'Carpool Ride',
          fromPoint,
          toPoint,
          date,
          time,
          capacity,
          tollCost,
          status,
          liveMapLink: '',
          passengers
        });
        ridesStatusFilter = status === 'completed' ? 'completed' : 'upcoming';
        showToast(status === 'completed' ? 'Past ride logged!' : 'Ride scheduled!');
      }

      closeModal();
      currentTab = 'rides';
      saveState();
    }

    /*****************************************************************
     * 11. END RIDE SETTLEMENT MODAL
     *****************************************************************/
    function openSettlementModal(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;

      const rows = ride.passengers.length === 0
        ? `<p class="text-xs text-gray-400 text-center py-3">No riders were added to this ride.</p>`
        : ride.passengers.map((p, idx) => {
            const defaultVal = p.paidAmount > 0 ? p.paidAmount : p.fare;
            return `
              <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3 space-y-2">
                <div class="flex items-center justify-between">
                  <label class="flex items-center gap-2.5 cursor-pointer">
                    <input type="checkbox" id="settle_paid_${idx}" ${p.paid ? 'checked' : ''} class="w-5 h-5 rounded accent-emerald-600">
                    <div>
                      <p class="text-sm font-bold text-gray-900">${escapeHtml(p.name)}</p>
                      <p class="text-[11px] text-gray-500">Default Fare: ${formatCurrency(p.fare)}</p>
                    </div>
                  </label>
                  <span class="text-xs font-semibold text-gray-500">Paid?</span>
                </div>
                <div class="grid grid-cols-2 gap-2.5 pt-1">
                  <div class="min-w-0">
                    <label class="text-[10px] font-semibold text-gray-500 uppercase block mb-0.5">Amount (${RS})</label>
                    <input type="number" id="settle_amt_${idx}" value="${defaultVal}" class="w-full bg-white border border-gray-200 rounded-xl px-2.5 py-1.5 text-sm font-bold">
                  </div>
                  <div class="min-w-0">
                    <label class="text-[10px] font-semibold text-gray-500 uppercase block mb-0.5">Mode</label>
                    <select id="settle_mode_${idx}" class="w-full bg-white border border-gray-200 rounded-xl px-2.5 py-1.5 text-sm">
                      <option value="UPI" ${p.payMode === 'UPI' ? 'selected' : ''}>UPI</option>
                      <option value="Cash" ${p.payMode === 'Cash' ? 'selected' : ''}>Cash</option>
                      <option value="Bank" ${p.payMode === 'Bank' ? 'selected' : ''}>Bank</option>

          }).join('');

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-lg font-bold">Ride Settlement &amp; Toll</h3>
              <p class="text-xs text-gray-500">${escapeHtml(ride.routeName)} &bull; ${formatDateDisplay(ride.date)}</p>
            </div>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>

          <div class="bg-amber-50/80 border border-amber-200 rounded-2xl p-3 flex items-center justify-between gap-3">
            <div class="min-w-0">
              <p class="text-xs font-bold text-amber-900">Toll Charges Paid (${RS})</p>
              <p class="text-[10px] text-amber-700">Pre-filled from schedule (enter 0 if no toll)</p>
            </div>
            <input type="number" id="settleTollInput" value="${ride.tollCost ?? 0}" class="w-24 bg-white border border-amber-300 rounded-xl px-2.5 py-2 text-sm font-bold text-right shrink-0">
          </div>

          <div class="space-y-2.5 max-h-60 overflow-y-auto">${rows}</div>

          <div class="grid grid-cols-2 gap-2.5 pt-1">
            <button onclick="saveSettlement('${ride.id}', false)" class="bg-blue-600 active:bg-blue-700 text-white text-xs font-semibold py-3 rounded-2xl shadow-xs">
              Save Settlement
            </button>
            <button onclick="saveSettlement('${ride.id}', true)" class="bg-emerald-600 active:bg-emerald-700 text-white text-xs font-semibold py-3 rounded-2xl shadow-xs">
              Save &amp; Thank All
            </button>
          </div>
        </div>
