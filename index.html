    }

    function saveSettlement(rideId, triggerThankYou) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;

      ride.tollCost = parseFloat(document.getElementById('settleTollInput').value) || 0;

      ride.passengers.forEach((p, idx) => {
        const isPaid = document.getElementById(`settle_paid_${idx}`).checked;
        const amt = parseFloat(document.getElementById(`settle_amt_${idx}`).value) || 0;
        const mode = document.getElementById(`settle_mode_${idx}`).value;

        p.paid = isPaid;
        p.paidAmount = isPaid ? amt : 0;
        p.payMode = mode;
      });

      saveState();
      if (triggerThankYou && ride.passengers.length > 0) {
        initSingleButtonDispatch(rideId, 'end');
      } else {
        closeModal();
        showToast('Settlement & toll saved!');
      }
    }

    /*****************************************************************
     * 12. UNIFIED EXPENSES & FUEL TAB (EDITABLE + 3-WAY AUTO-CALC + OVERLAP FREE)
     *****************************************************************/
    function setExpenseCategoryFilter(cat) {
      expenseCategoryFilter = cat;
      renderApp();
    }

    function renderExpenses() {
      const allSorted = [...state.fuelLogs].sort((a, b) => (b.date + (b.odometer || 0)).localeCompare(a.date + (a.odometer || 0)));
      const fuelOnlySorted = [...state.fuelLogs]
        .filter(f => (f.category || 'Fuel') === 'Fuel' && Number(f.odometer) > 0)
        .sort((a, b) => Number(a.odometer) - Number(b.odometer));

      const totalSpentAll = allSorted.reduce((s, f) => s + (Number(f.totalCost) || 0), 0);
      const totalFuelSpent = fuelOnlySorted.reduce((s, f) => s + (Number(f.totalCost) || 0), 0);
      const totalOtherSpent = totalSpentAll - totalFuelSpent;
      const totalLiters = fuelOnlySorted.reduce((s, f) => s + (Number(f.liters) || 0), 0);

      let totalDist = 0;
      let mileageStr = '--';
      let costPerKmStr = '--';

      if (fuelOnlySorted.length >= 2) {
        totalDist = Number(fuelOnlySorted[fuelOnlySorted.length - 1].odometer) - Number(fuelOnlySorted[0].odometer);
        const litersAfterFirst = fuelOnlySorted.slice(1).reduce((s, f) => s + (Number(f.liters) || 0), 0);
        const costAfterFirst = fuelOnlySorted.slice(1).reduce((s, f) => s + (Number(f.totalCost) || 0), 0);
        if (totalDist > 0 && litersAfterFirst > 0) {
          mileageStr = (totalDist / litersAfterFirst).toFixed(1) + ' km/L';
          costPerKmStr = RS + (costAfterFirst / totalDist).toFixed(2) + '/km';
        }
      }

      // Compute tank-to-tank distance map for fuel entries
      const tankDistMap = {};
      for (let i = 1; i < fuelOnlySorted.length; i++) {
        const dist = Number(fuelOnlySorted[i].odometer) - Number(fuelOnlySorted[i - 1].odometer);
        const kmpl = dist > 0 && fuelOnlySorted[i].liters > 0 ? (dist / fuelOnlySorted[i].liters).toFixed(1) : '';
        tankDistMap[fuelOnlySorted[i].id] = { dist, kmpl };
      }

      const categories = ['all', 'Fuel', 'Toll', 'Maintenance', 'Car Wash', 'Parking', 'Other'];

    function openExpenseModal(editId = null) {
      const existing = editId ? state.fuelLogs.find(f => f.id === editId) : null;
      const lastOdo = state.fuelLogs.length > 0
        ? Math.max(...state.fuelLogs.map(f => Number(f.odometer) || 0))
        : '';

      const initCat = existing ? (existing.category || 'Fuel') : 'Fuel';
      const initDate = existing ? existing.date : todayStr();
      const initOdo = existing ? (existing.odometer || '') : '';
      const initPpl = existing ? (existing.pricePerLiter || '') : '';
      const initLiters = existing ? (existing.liters || '') : '';
      const initCost = existing ? (existing.totalCost || '') : '';
      const initNotes = existing ? (existing.notes || '') : '';

      fuelCalcHistory = ['price', 'liters'];

      const catOptions = ['Fuel', 'Toll', 'Maintenance', 'Car Wash', 'Parking', 'Other'].map(c =>
        `<option value="${c}" ${initCat === c ? 'selected' : ''}>${c}</option>`
      ).join('');

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">${existing ? 'Edit Expense / Fuel Log' : 'Log Fuel or Vehicle Cost'}</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>

            </div>
          </div>

          <!-- Fuel-Specific Fields (Odometer, Price/L, Liters) -->
          <div id="fuelFieldsSection" class="${initCat === 'Fuel' ? '' : 'hidden'} space-y-3 bg-blue-50/50 border border-blue-100 rounded-2xl p-3.5">
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-700 mb-1">Odometer Reading (km)</label>
              <input type="number" id="expOdo" value="${initOdo}" placeholder="${lastOdo ? 'Last recorded: ' + lastOdo + ' km' : 'e.g. 43100'}" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm font-semibold">
            </div>

            <div class="grid grid-cols-2 gap-3">

                <label class="block text-xs font-semibold text-gray-700 mb-1">Fuel Liters (L)</label>
                <input type="number" step="0.01" id="expLiters" value="${initLiters}" oninput="handleFuelAutoCalc('liters')" placeholder="e.g. 25.5" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-sm">
              </div>
            </div>
            <p class="text-[11px] text-blue-700">Enter any 2 of Price/L, Liters, or Total Cost to auto-calculate the 3rd.</p>
          </div>

          <!-- Total Cost & Notes -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Total Cost (${RS}) *</label>

            </div>
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Notes / Station / Details</label>
              <input type="text" id="expNotes" value="${escapeHtml(initNotes)}" placeholder="e.g. HP Pump / ORR Toll / Service" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-sm">
            </div>
          </div>

          <button onclick="saveExpenseEntry('${editId || ''}')" class="w-full bg-blue-600 active:bg-blue-700 text-white text-sm font-semibold py-3 rounded-2xl shadow-sm">

    function onExpenseCategoryChange() {
      const cat = document.getElementById('expCategory').value;
      const fuelSec = document.getElementById('fuelFieldsSection');
      if (cat === 'Fuel') fuelSec.classList.remove('hidden');
      else fuelSec.classList.add('hidden');
    }

    function handleFuelAutoCalc(changedField) {
      const cat = document.getElementById('expCategory').value;
      if (cat !== 'Fuel') return;

      // Record the two most recently edited fields
      fuelCalcHistory = fuelCalcHistory.filter(f => f !== changedField);
      fuelCalcHistory.push(changedField);
      if (fuelCalcHistory.length > 2) fuelCalcHistory.shift();

      const priceEl = document.getElementById('expPricePerLiter');
      const litersEl = document.getElementById('expLiters');
      const totalEl = document.getElementById('expCost');

      const price = parseFloat(priceEl.value);
      const liters = parseFloat(litersEl.value);
      const total = parseFloat(totalEl.value);

      const hasPrice = !isNaN(price) && price > 0;
      const hasLiters = !isNaN(liters) && liters > 0;
      const hasTotal = !isNaN(total) && total > 0;

      const thirdField = ['price', 'liters', 'total'].find(f => !fuelCalcHistory.includes(f));

      if (thirdField === 'total' && hasPrice && hasLiters) {
        totalEl.value = (price * liters).toFixed(2);
      } else if (thirdField === 'liters' && hasTotal && hasPrice) {
        litersEl.value = (total / price).toFixed(2);
      } else if (thirdField === 'price' && hasTotal && hasLiters) {
        priceEl.value = (total / liters).toFixed(2);
      }
    }

    function saveExpenseEntry(editId) {
      const category = document.getElementById('expCategory').value || 'Fuel';
      const date = document.getElementById('expDate').value || todayStr();
      const odometer = category === 'Fuel' ? (parseFloat(document.getElementById('expOdo').value) || 0) : 0;
      const pricePerLiter = category === 'Fuel' ? (parseFloat(document.getElementById('expPricePerLiter').value) || 0) : 0;
      const liters = category === 'Fuel' ? (parseFloat(document.getElementById('expLiters').value) || 0) : 0;
      const totalCost = parseFloat(document.getElementById('expCost').value) || 0;
      const notes = document.getElementById('expNotes').value.trim();

      if (totalCost <= 0) {
        alert('Please enter a valid Total Cost.');
        return;
      }
      if (category === 'Fuel' && odometer <= 0) {
        alert('Please enter the Odometer reading for Fuel logs.');
        return;
      }

      const entryObj = {
        id: editId || ('fuel_' + Date.now()),
        category,
        date,
        odometer,
        pricePerLiter: pricePerLiter || (liters > 0 ? Number((totalCost / liters).toFixed(2)) : 0),
        liters,
        totalCost,
        notes
      };

      if (editId) {
        const idx = state.fuelLogs.findIndex(f => f.id === editId);
        if (idx !== -1) state.fuelLogs[idx] = entryObj;
        showToast('Entry updated!');
      } else {
        state.fuelLogs.push(entryObj);
        showToast(`${category} expense saved!`);
      }

      closeModal();
      saveState();
    }

    function deleteExpense(id) {
      if (!confirm('Delete this expense entry?')) return;
      state.fuelLogs = state.fuelLogs.filter(f => f.id !== id);
      saveState();
      showToast('Entry deleted');
    }

    function insertTagAtCursor(textareaId, tagText) {
      const el = document.getElementById(textareaId);
      if (!el) return;
      const start = el.selectionStart || el.value.length;
      const end = el.selectionEnd || el.value.length;
      el.value = el.value.substring(0, start) + tagText + el.value.substring(end);
      el.focus();
      el.selectionStart = el.selectionEnd = start + tagText.length;
    }

                <label class="block text-xs font-bold text-gray-700 mb-1">1. Ride Started Message</label>
                ${renderTagChips('setMsgStart')}
                <textarea id="setMsgStart" rows="4" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm leading-relaxed resize-y focus:border-blue-500 outline-none">${escapeHtml(state.settings.msgStart)}</textarea>
              </div>

              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">2. Ride Ended / Thank You Message</label>
                ${renderTagChips('setMsgEnd')}
                <textarea id="setMsgEnd" rows="4" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm leading-relaxed resize-y focus:border-blue-500 outline-none">${escapeHtml(state.settings.msgEnd)}</textarea>
              </div>

              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">3. Payment Reminder Message</label>
                ${renderTagChips('setMsgReminder')}
                <textarea id="setMsgReminder" rows="4" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm leading-relaxed resize-y focus:border-blue-500 outline-none">${escapeHtml(state.settings.msgReminder)}</textarea>
              </div>

              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">4. Ride Time Update Message</label>
                ${renderTagChips('setMsgTimeUpdate')}
                <textarea id="setMsgTimeUpdate" rows="4" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm leading-relaxed resize-y focus:border-blue-500 outline-none">${escapeHtml(state.settings.msgTimeUpdate)}</textarea>
              </div>

              <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">5. Ride Cancelled Message</label>
                ${renderTagChips('setMsgCancelled')}
                <textarea id="setMsgCancelled" rows="4" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-sm leading-relaxed resize-y focus:border-blue-500 outline-none">${escapeHtml(state.settings.msgCancelled)}</textarea>
              </div>

              <button onclick="saveTemplates()" class="w-full bg-blue-600 active:bg-blue-700 text-white text-sm font-semibold py-3.5 rounded-2xl shadow-xs">
                Save Profile &amp; All Templates
              </button>
            </div>
          </div>
        `;
      }

      const accountCard = currentUser
        ? `
          <div class="bg-white rounded-2xl p-4 shadow-xs border border-gray-100 space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-1.5">
                <span class="text-emerald-600">${ICONS.cloud}</span>
                <h3 class="text-xs font-bold uppercase tracking-wider text-gray-700">Cloud Account Connected</h3>
              </div>
              <span class="text-[10px] font-bold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full">Real-Time Sync</span>
            </div>
            <div class="bg-gray-50 rounded-xl p-3 text-xs space-y-1">
              <p class="text-gray-500">Signed in as:</p>
              <p class="font-bold text-gray-900">${escapeHtml(currentUser.email)}</p>
              <p class="text-[11px] text-gray-400 pt-1">Log in with this same email and password on any iPhone, Android, or laptop to access your data instantly.</p>
            </div>
            <button onclick="handleSignOut()" class="w-full bg-red-50 active:bg-red-100 text-red-600 border border-red-200 text-xs font-bold py-2.5 rounded-xl">
              Sign Out of Cloud Account
            </button>
          </div>
        `
        : '';

      return `
        ${subNav}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          ${accountCard}
          <div class="bg-white rounded-2xl p-4 shadow-xs border border-gray-100 space-y-2.5">
            <h3 class="text-xs font-bold uppercase tracking-wider text-gray-500">Export &amp; Local Backup</h3>
            <div class="grid grid-cols-2 gap-2.5">
              <button onclick="downloadBackupJSON()" class="bg-gray-900 text-white text-xs font-semibold py-2.5 rounded-xl">
                Download JSON
              </button>
              <label class="bg-gray-100 text-gray-800 text-xs font-semibold py-2.5 rounded-xl text-center cursor-pointer">
                Restore JSON
                <input type="file" accept=".json" onchange="restoreBackupJSON(event)" class="hidden">
              </label>
            </div>
            <button onclick="exportRidesCSV()" class="w-full bg-emerald-50 text-emerald-700 border border-emerald-200 text-xs font-semibold py-2.5 rounded-xl">
              Export Rides Ledger (CSV)
            </button>
            <button onclick="resetAllData()" class="w-full text-red-500 text-[11px] font-semibold py-2">
              Clear All Data / Start Fresh
            </button>
          </div>
        </div>
      `;
    }

    function openRiderFormModal(riderId = null) {
      const existing = riderId ? state.riders.find(r => r.id === riderId) : null;
      openModal(`
        <div class="space-y-3.5">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">${existing ? 'Edit Rider' : 'New Rider'}</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Full Name *</label>
              <input type="text" id="rfName" value="${existing ? escapeHtml(existing.name) : ''}" placeholder="Rahul Sharma" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Company</label>
              <input type="text" id="rfCompany" value="${existing ? escapeHtml(existing.company || '') : ''}" placeholder="Tech Mahindra" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">WhatsApp Phone (91) *</label>
              <input type="tel" id="rfPhone" value="${existing ? existing.phone : '91'}" placeholder="919876543210" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Default Fare (${RS})</label>
              <input type="number" id="rfFare" value="${existing ? existing.defaultFare : ''}" placeholder="150" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs font-bold">
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Default Pickup</label>
              <input type="text" id="rfPickup" value="${existing ? escapeHtml(existing.pickup) : ''}" placeholder="Turkayamjal" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Default Drop</label>
              <input type="text" id="rfDrop" value="${existing ? escapeHtml(existing.drop) : ''}" placeholder="Tech Mahindra" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Rider Joined Date</label>
              <input type="date" id="rfJoinedDate" value="${existing ? (existing.joinedDate || todayStr()) : todayStr()}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Preferred Shift Timing</label>
              <input type="text" id="rfShift" value="${existing ? escapeHtml(existing.shift || '') : ''}" placeholder="09:00 AM - 06:00 PM" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
          </div>
          <div class="min-w-0">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Landmark / Notes</label>
            <input type="text" id="rfNotes" value="${existing ? escapeHtml(existing.notes || '') : ''}" placeholder="Gate 2 / Pays Friday" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
          </div>
          <button onclick="saveRiderForm('${riderId || ''}')" class="w-full bg-blue-600 text-white text-sm font-semibold py-3 rounded-2xl shadow-sm">
            Save Rider
          </button>
        </div>
      `);
    }

    function saveRiderForm(riderId) {
      const name = document.getElementById('rfName').value.trim();
      const company = document.getElementById('rfCompany').value.trim();
      const phone = document.getElementById('rfPhone').value.trim().replace(/[^0-9]/g, '');
      const defaultFare = parseFloat(document.getElementById('rfFare').value) || 0;
      const pickup = document.getElementById('rfPickup').value.trim() || 'Pickup';
      const drop = document.getElementById('rfDrop').value.trim() || 'Drop';
      const joinedDate = document.getElementById('rfJoinedDate').value || todayStr();
      const shift = document.getElementById('rfShift').value.trim();
      const notes = document.getElementById('rfNotes').value.trim();

      if (!name || !phone) {
        alert('Name and Phone number are required.');
        return;
      }

      const riderObj = { id: riderId || ('r_' + Date.now()), name, company, phone, pickup, drop, defaultFare, joinedDate, shift, notes };
      if (riderId) {
        const idx = state.riders.findIndex(r => r.id === riderId);
        if (idx !== -1) state.riders[idx] = riderObj;
      } else {
        state.riders.push(riderObj);
      }

      closeModal();
      saveState();
      showToast('Rider saved!');
    }

    function deleteRider(id) {
      if (!confirm('Remove this rider from your database?')) return;
      state.riders = state.riders.filter(r => r.id !== id);
      saveState();
    }

    function openRouteFormModal(routeId = null) {
      const existing = routeId ? state.routes.find(r => r.id === routeId) : null;
      openModal(`
        <div class="space-y-3.5">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">${existing ? 'Edit Ride Route' : 'New Ride Route'}</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>
          <div class="min-w-0">
            <label class="block text-xs font-semibold text-gray-600 mb-1">Ride / Route Name</label>
            <input type="text" id="rtName" value="${existing ? escapeHtml(existing.name) : ''}" placeholder="e.g. Return Ride (Evening)" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Default From</label>
              <input type="text" id="rtFrom" value="${existing ? escapeHtml(existing.fromPoint || '') : ''}" placeholder="Tech Mahindra" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Default To</label>
              <input type="text" id="rtTo" value="${existing ? escapeHtml(existing.toPoint || '') : ''}" placeholder="Turkayamjal" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Start Time</label>
              <input type="time" id="rtTime" value="${existing ? existing.defaultTime : '08:30'}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Seats</label>
              <input type="number" id="rtCap" value="${existing ? existing.capacity : 4}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs">
            </div>
            <div class="min-w-0">
              <label class="block text-xs font-semibold text-gray-600 mb-1">Default Toll (${RS})</label>
              <input type="number" id="rtToll" value="${existing ? (existing.defaultToll || 0) : 0}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-xs font-bold">
            </div>
          </div>
          <label class="flex items-center gap-2.5 bg-purple-50 border border-purple-200 rounded-xl p-3 cursor-pointer">
            <input type="checkbox" id="rtIsReturn" ${existing && existing.isReturn ? 'checked' : ''} class="w-4 h-4 accent-purple-600 shrink-0">
            <div>
              <p class="text-xs font-bold text-purple-900">Return Trip (Auto-Swap Pickup &amp; Drop)</p>
              <p class="text-[10px] text-purple-700">Automatically reverses every rider's default Pickup and Drop points when scheduling.</p>
            </div>
          </label>
          <button onclick="saveRouteForm('${routeId || ''}')" class="w-full bg-blue-600 text-white text-sm font-semibold py-3 rounded-2xl shadow-sm">
            Save Route
          </button>
        </div>
      `);
    }

    function saveRouteForm(routeId) {
      const name = document.getElementById('rtName').value.trim();
      const fromPoint = document.getElementById('rtFrom').value.trim();
      const toPoint = document.getElementById('rtTo').value.trim();
      const defaultTime = document.getElementById('rtTime').value || '08:30';
      const capacity = parseInt(document.getElementById('rtCap').value, 10) || 4;
      const defaultToll = parseFloat(document.getElementById('rtToll').value) || 0;
      const isReturn = document.getElementById('rtIsReturn').checked;

      if (!name) {
        alert('Please enter a Ride Name.');
        return;
      }

      const routeObj = { id: routeId || ('rt_' + Date.now()), name, fromPoint, toPoint, defaultTime, capacity, defaultToll, isReturn };
      if (routeId) {
        const idx = state.routes.findIndex(r => r.id === routeId);
        if (idx !== -1) state.routes[idx] = routeObj;
      } else {
        state.routes.push(routeObj);
      }

      closeModal();
      saveState();
      showToast('Route saved!');
    }

    function deleteRoute(id) {
      if (!confirm('Delete this route template?')) return;
      state.routes = state.routes.filter(r => r.id !== id);
      saveState();
    }

    function saveTemplates() {
      state.settings.driverName = document.getElementById('setDriverName').value.trim();
      state.settings.driverPhone = document.getElementById('setDriverPhone').value.trim();
      state.settings.vehicleInfo = document.getElementById('setVehicleInfo').value.trim();
      state.settings.adminPhone = document.getElementById('setAdminPhone').value.trim();
      state.settings.upiId = document.getElementById('setUpi').value.trim();
      state.settings.groupLink = document.getElementById('setGroupLink').value.trim();
      state.settings.msgStart = document.getElementById('setMsgStart').value;
      state.settings.msgEnd = document.getElementById('setMsgEnd').value;
      state.settings.msgReminder = document.getElementById('setMsgReminder').value;
      state.settings.msgTimeUpdate = document.getElementById('setMsgTimeUpdate').value;
      state.settings.msgCancelled = document.getElementById('setMsgCancelled').value;
      saveState();
      showToast('Profile & Templates saved!');
    }

    function downloadBackupJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `CarpoolPro_Backup_${todayStr()}.json`;
      a.click();
      showToast('Backup JSON downloaded');
    }

    function restoreBackupJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.riders && imported.rides) {
            state = normalizeState(imported);
            saveState();
            showToast('Backup restored & synced!');
          } else {
            alert('Invalid backup file format.');
          }
        } catch (err) {
          alert('Could not read JSON file.');
        }
      };
      reader.readAsText(file);
    }

    function exportRidesCSV() {
      let csv = 'Date,Time,Ride Name,From,To,Toll,Status,Rider Name,Company,Phone,Pickup,Drop,Fare,Paid,Paid Amount,Payment Mode\n';
      state.rides.forEach(ride => {
        if (ride.passengers.length === 0) {
          csv += `"${ride.date}","${ride.time}","${ride.routeName}","${ride.fromPoint || ''}","${ride.toPoint || ''}",${ride.tollCost || 0},"${ride.status}","", "", "", "", "",0,No,0,""\n`;
        } else {
          ride.passengers.forEach(p => {
            csv += `"${ride.date}","${ride.time}","${ride.routeName}","${ride.fromPoint || ''}","${ride.toPoint || ''}",${ride.tollCost || 0},"${ride.status}","${p.name}","${p.company || ''}","${p.phone}","${p.pickup}","${p.drop}",${p.fare},${p.paid ? 'Yes' : 'No'},${p.paidAmount || 0},"${p.payMode || ''}"\n`;
          });
        }
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `CarpoolPro_Ledger_${todayStr()}.csv`;
      a.click();
      showToast('CSV exported');
    }

    function resetAllData() {
      if (!confirm('Clear all rides, expense logs, and riders in your account so you can start with a blank slate?')) return;
      state = {
        riders: [],
        routes: [
          { id: 'rt1', name: 'Office Ride (Morning)', fromPoint: 'Home', toPoint: 'Office', defaultTime: '08:30', capacity: 4, defaultToll: 0, isReturn: false },
          { id: 'rt2', name: 'Return Ride (Evening)', fromPoint: 'Office', toPoint: 'Home', defaultTime: '18:30', capacity: 4, defaultToll: 0, isReturn: true }
        ],
        rides: [],
        fuelLogs: [],
        settings: state.settings
      };
      saveState();
      showToast('All records cleared');
    }
  </script>
</body>
</html>
