            </div>
            <div>
              <p class="text-[10px] text-gray-400 uppercase">Tolls</p>
              <p class="text-base font-bold text-rose-400 mt-0.5">${formatCurrency(totalTolls)}</p>
            </div>
            <div>
              <p class="text-[10px] text-gray-400 uppercase">Net Route</p>
              <p class="text-base font-bold text-white mt-0.5">${formatCurrency(totalPaid - totalTolls)}</p>
            </div>
          </div>

          <div class="space-y-2 max-h-64 overflow-y-auto">
            <p class="text-xs font-bold uppercase tracking-wider text-gray-500">Trip Breakdown</p>
            ${tripCards}
          </div>
        </div>
      `);
    }

    function quickMarkPaid(rideId, riderId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;
      const p = ride.passengers.find(x => x.riderId === riderId);
      if (!p) return;
      p.paid = true;
      p.paidAmount = p.fare;
      saveState();
      showToast(`Marked ${p.name} as Paid!`);
    }

    /*****************************************************************
     * 8. RIDES TAB (SCHEDULE, EDIT ANY RIDE, ADMIN POST, UPDATES)
     *****************************************************************/
    function setRidesFilter(f) {
      ridesFilter = f;
      renderApp();
    }

    function renderRides() {
      const sorted = [...state.rides].sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
      const list = sorted.filter(r => {
        if (ridesFilter === 'upcoming') return r.status === 'scheduled' || r.status === 'active';
        if (ridesFilter === 'completed') return r.status === 'completed';
        return true;
      });

      const filterBar = `
        <div class="grid grid-cols-3 bg-gray-200/80 p-1 rounded-xl text-xs font-semibold">
          <button onclick="setRidesFilter('upcoming')" class="py-1.5 rounded-lg transition ${ridesFilter === 'upcoming' ? 'bg-white text-gray-900 shadow-xs' : 'text-gray-600'}">Active &amp; Next</button>
          <button onclick="setRidesFilter('completed')" class="py-1.5 rounded-lg transition ${ridesFilter === 'completed' ? 'bg-white text-gray-900 shadow-xs' : 'text-gray-600'}">Completed</button>
          <button onclick="setRidesFilter('all')" class="py-1.5 rounded-lg transition ${ridesFilter === 'all' ? 'bg-white text-gray-900 shadow-xs' : 'text-gray-600'}">All (${state.rides.length})</button>
        </div>
      `;

      if (list.length === 0) {
        return `
          ${filterBar}
          <div class="bg-white rounded-2xl p-8 text-center border border-gray-100 space-y-2">
            <p class="text-sm font-semibold text-gray-700">No rides found in this view</p>
            <p class="text-xs text-gray-400">Tap "+ Schedule" at the top right to schedule a ride or log a past trip.</p>
          </div>
        `;
      }

      const cards = list.map(ride => {
        const routeObj = state.routes.find(rt => rt.id === ride.routeId);
        const capacity = ride.capacity || (routeObj ? routeObj.capacity : 4);
        const seatsLeft = Math.max(0, capacity - ride.passengers.length);
        const totalFare = ride.passengers.reduce((s, p) => s + (Number(p.fare) || 0), 0);
        const totalPaid = ride.passengers.reduce((s, p) => s + (p.paid ? (Number(p.paidAmount) || Number(p.fare)) : (Number(p.paidAmount) || 0)), 0);

        let badgeClass = 'bg-blue-50 text-blue-600';
        let badgeText = 'Scheduled';
        if (ride.status === 'active') {
          badgeClass = 'bg-amber-100 text-amber-700';
          badgeText = 'In Progress';
        } else if (ride.status === 'completed') {
          badgeClass = 'bg-emerald-50 text-emerald-700';
          badgeText = 'Completed';
        }

        const passengerRows = ride.passengers.length === 0
          ? `<div class="py-3 text-center text-xs text-gray-400 border-t border-gray-50">No riders added yet &bull; <button onclick="openRideFormModal('${ride.id}')" class="text-blue-600 font-semibold underline">+ Add Riders</button></div>`
          : ride.passengers.map(p => `
              <div class="flex items-center justify-between py-1.5 text-xs border-t border-gray-50">
                <div>
                  <span class="font-semibold text-gray-800">${p.name}</span>
                  <span class="text-gray-400 block text-[11px]">${p.pickup} ${ICONS.arrowRight} ${p.drop}</span>
                </div>
                <div class="text-right">
                  <span class="font-bold text-gray-900">${formatCurrency(p.fare)}</span>
                  ${ride.status === 'completed'
                    ? `<span class="block text-[10px] font-semibold ${p.paid && p.paidAmount >= p.fare ? 'text-emerald-600' : 'text-red-500'}">${p.paid && p.paidAmount >= p.fare ? 'Paid' : `Due ${formatCurrency(Math.max(0, p.fare - (p.paidAmount || 0)))}`}</span>`
                    : ''}
                </div>
              </div>
            `).join('');

        let actionButtons = '';
        if (ride.status === 'scheduled') {
          actionButtons = `
            <div class="space-y-2 pt-2 border-t border-gray-100">
              <div class="flex items-center gap-2">
                <button onclick="startRide('${ride.id}')" class="flex-1 bg-emerald-600 active:bg-emerald-700 text-white text-xs font-semibold py-2.5 rounded-xl shadow-xs flex items-center justify-center gap-1.5">
                  ${ICONS.play} Start Ride &amp; Notify
                </button>
                <button onclick="openAdminPostModal('${ride.id}')" class="bg-indigo-50 active:bg-indigo-100 text-indigo-700 border border-indigo-200 text-xs font-semibold px-3 py-2.5 rounded-xl">
                  Admin Post
                </button>
              </div>
              <div class="flex items-center gap-1.5">
                <button onclick="openRideFormModal('${ride.id}')" class="flex-1 bg-gray-100 active:bg-gray-200 text-gray-800 text-[11px] font-semibold py-2 rounded-xl flex items-center justify-center gap-1">
                  ${ICONS.edit} Edit / Riders
                </button>
                <button onclick="openRideUpdatesModal('${ride.id}')" class="flex-1 bg-amber-50 active:bg-amber-100 text-amber-800 border border-amber-200 text-[11px] font-semibold py-2 rounded-xl">
                  Time / Cancel Msg
                </button>
                <button onclick="cloneRide('${ride.id}')" class="bg-gray-100 text-gray-700 text-[11px] font-semibold px-2.5 py-2 rounded-xl">
                  Repeat
                </button>
                <button onclick="deleteRide('${ride.id}')" class="bg-red-50 text-red-600 p-2 rounded-xl flex items-center justify-center" aria-label="Delete">
                  ${ICONS.trash}
                </button>
              </div>
            </div>
          `;
        } else if (ride.status === 'active') {
          actionButtons = `
            <div class="flex items-center gap-2 pt-2 border-t border-gray-100">
              <button onclick="openLiveLocationModal('${ride.id}')" class="flex-1 bg-blue-600 active:bg-blue-700 text-white text-xs font-semibold py-2.5 rounded-xl shadow-xs flex items-center justify-center gap-1.5">
                ${ICONS.pin} Live Location
              </button>
              <button onclick="openRideFormModal('${ride.id}')" class="bg-gray-100 text-gray-800 text-xs font-semibold px-3 py-2.5 rounded-xl">
                Edit
              </button>
              <button onclick="endRide('${ride.id}')" class="flex-1 bg-gray-900 active:bg-gray-800 text-white text-xs font-semibold py-2.5 rounded-xl shadow-xs flex items-center justify-center gap-1.5">
                ${ICONS.stop} End &amp; Settle
              </button>
            </div>
          `;
        } else {
          actionButtons = `
            <div class="flex items-center gap-1.5 pt-2 border-t border-gray-100">
              <button onclick="openSettlementModal('${ride.id}')" class="flex-1 bg-blue-50 active:bg-blue-100 text-blue-700 border border-blue-200 text-xs font-semibold py-2 rounded-xl flex items-center justify-center gap-1">
                ${ICONS.check} Payments (${formatCurrency(totalPaid)}/${formatCurrency(totalFare)})
              </button>
              <button onclick="openRideFormModal('${ride.id}')" class="bg-gray-100 text-gray-800 text-xs font-semibold px-2.5 py-2 rounded-xl">
                Edit
              </button>
              <button onclick="cloneRide('${ride.id}')" class="bg-gray-100 text-gray-700 text-xs font-semibold px-2.5 py-2 rounded-xl">
                Repeat
              </button>
              <button onclick="deleteRide('${ride.id}')" class="bg-red-50 text-red-600 p-2 rounded-xl flex items-center justify-center" aria-label="Delete">
                ${ICONS.trash}
              </button>
            </div>
          `;
        }

        return `
          <div class="bg-white rounded-2xl p-4 shadow-xs border border-gray-100 space-y-2.5">
            <div class="flex items-start justify-between">
              <div>
                <h3 class="font-bold text-base text-gray-900">${ride.routeName}</h3>
                <p class="text-xs text-gray-500 mt-0.5">${formatDateDisplay(ride.date)} at ${formatTime12Hr(ride.time)}</p>
                <p class="text-[11px] text-gray-400 mt-0.5">
                  Seats: ${ride.passengers.length}/${capacity} (${seatsLeft} avail) &bull; Toll: ${formatCurrency(ride.tollCost || 0)}
                </p>
              </div>
              <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${badgeClass}">${badgeText}</span>
            </div>

            <div class="space-y-0.5">
              ${passengerRows}
            </div>

            ${actionButtons}
          </div>
        `;
      }).join('');

      return `${filterBar}<div class="space-y-3">${cards}</div>`;
    }

    function startRide(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;
      ride.status = 'active';
      saveState();
      if (ride.passengers.length > 0) {
        initSingleButtonDispatch(rideId, 'start');
      } else {
        showToast('Ride started!');
      }
    }

    function endRide(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;
      ride.status = 'completed';
      ride.passengers.forEach(p => {
        if (p.paidAmount === 0 && !p.paid) {
          p.paidAmount = p.fare;
        }
      });
      saveState();
      openSettlementModal(rideId);
    }

    function cloneRide(rideId) {
      const orig = state.rides.find(r => r.id === rideId);
      if (!orig) return;
      const cloned = {
        id: 'ride_' + Date.now(),
        routeId: orig.routeId,
        routeName: orig.routeName,
        fromPoint: orig.fromPoint || '',
        toPoint: orig.toPoint || '',
        date: todayStr(),
        time: orig.time,
        capacity: orig.capacity || 4,
        tollCost: orig.tollCost || 0,
        status: 'scheduled',
        liveMapLink: '',
        passengers: orig.passengers.map(p => ({
          ...p,
          paid: false,
          paidAmount: 0
        }))
      };
      state.rides.unshift(cloned);
      ridesFilter = 'upcoming';
      saveState();
      showToast(`Repeated "${orig.routeName}" for today!`);
    }

    function deleteRide(rideId) {
      if (!confirm('Delete this ride permanently?')) return;
      state.rides = state.rides.filter(r => r.id !== rideId);
      saveState();
      showToast('Ride deleted');
    }

    /*****************************************************************
     * 9. WHATSAPP ADMIN SEAT POST, RIDE UPDATES & SINGLE-BUTTON QUEUE
     *****************************************************************/
    function openAdminPostModal(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;
      const routeObj = state.routes.find(rt => rt.id === ride.routeId);
      const capacity = ride.capacity || (routeObj ? routeObj.capacity : 4);
      const seatsAvail = Math.max(0, capacity - ride.passengers.length);

      const fromLoc = ride.fromPoint || (routeObj ? routeObj.fromPoint : (ride.passengers[0] ? ride.passengers[0].pickup : 'Origin'));
      const toLoc = ride.toPoint || (routeObj ? routeObj.toPoint : (ride.passengers[0] ? ride.passengers[0].drop : 'Destination'));
      const rideHeaderTitle = ride.routeName.toUpperCase().includes('RIDE')
        ? `${ride.routeName.toUpperCase()} AVAILABLE`
        : `${ride.routeName.toUpperCase()} RIDE AVAILABLE`;

      const postText =
`${EMOJI.car} ${rideHeaderTitle} ${EMOJI.car}

${EMOJI.user} Name: ${state.settings.driverName || 'Driver'}
${EMOJI.cal} Date: ${formatDateDisplay(ride.date)}
${EMOJI.clock} Start Time: ${formatTime12Hr(ride.time)}

${EMOJI.pin} From: ${fromLoc}
${EMOJI.pin} To: ${toLoc}

${EMOJI.seat} Seats Available: ${seatsAvail}

${EMOJI.phone} Contact: ${state.settings.driverPhone || ''}

${EMOJI.sedan} Vehicle: ${state.settings.vehicleInfo || ''}
${EMOJI.point} Interested? WhatsApp me directly for booking.

${EMOJI.pray} Thank you! Have a safe ride! ${EMOJI.smile}`;

      const waUrl = buildWhatsAppUrl(state.settings.adminPhone || '', postText);

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">WhatsApp Admin Seat Post</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>

          <textarea id="adminPostTextarea" rows="13" class="w-full bg-gray-50 border border-gray-200 rounded-2xl p-3 text-xs font-mono leading-relaxed">${postText}</textarea>

          <div class="grid grid-cols-2 gap-2">
            <button onclick="copyAdminPostText()" class="bg-gray-100 active:bg-gray-200 text-gray-800 text-xs font-bold py-3 rounded-2xl">
              Copy Post Text
            </button>
            <a id="adminWaLink" href="${waUrl}" target="_blank" rel="noopener noreferrer" onclick="updateAdminWaHref()" class="bg-emerald-600 active:bg-emerald-700 text-white text-xs font-bold py-3 rounded-2xl shadow-xs flex items-center justify-center gap-1.5">
              ${ICONS.send} Send to Admin
            </a>
          </div>
        </div>
      `);
    }

    function updateAdminWaHref() {
      const txt = document.getElementById('adminPostTextarea').value;
      document.getElementById('adminWaLink').href = buildWhatsAppUrl(state.settings.adminPhone || '', txt);
    }

    function copyAdminPostText() {
      const el = document.getElementById('adminPostTextarea');
      el.select();
      navigator.clipboard.writeText(el.value).then(() => showToast('Admin post copied!'));
    }

    function openRideUpdatesModal(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;
      if (ride.passengers.length === 0) {
        alert('No riders are added to this ride yet.');
        return;
      }

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">Send Ride Update to Riders</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>

          <button onclick="initSingleButtonDispatch('${ride.id}', 'timeUpdate')" class="w-full text-left bg-blue-50 active:bg-blue-100 border border-blue-200 rounded-2xl p-3.5 space-y-1">
            <p class="text-sm font-bold text-blue-900">1. Ride Time Updated (${formatTime12Hr(ride.time)})</p>
            <p class="text-[11px] text-blue-700">Sends your updated start time message to all riders.</p>
          </button>

          <button onclick="initSingleButtonDispatch('${ride.id}', 'cancelled')" class="w-full text-left bg-red-50 active:bg-red-100 border border-red-200 rounded-2xl p-3.5 space-y-1">
            <p class="text-sm font-bold text-red-900">2. Ride Cancelled Notice</p>
            <p class="text-[11px] text-red-700">Notifies all riders that today's ride is cancelled.</p>
          </button>

          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3.5 space-y-2">
            <p class="text-sm font-bold text-gray-900">3. Custom Quick Note</p>
            <input type="text" id="customRideNoteInput" placeholder="e.g. Stuck in traffic, running 10 mins late" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs">
            <button onclick="sendCustomNoteToRiders('${ride.id}')" class="w-full bg-gray-900 text-white text-xs font-bold py-2.5 rounded-xl">
              Send Custom Note to All
            </button>
          </div>
        </div>
      `);
    }

    function sendCustomNoteToRiders(rideId) {
      const note = document.getElementById('customRideNoteInput').value.trim();
      if (!note) {
        alert('Please type a message first.');
        return;
      }
      initSingleButtonDispatch(rideId, 'custom', '', note);
    }

    function initSingleButtonDispatch(rideId, mode, extraLink = '', customNote = '') {
      batchQueue = {
        rideId,
        mode,
        index: 0,
        extraLink,
        customNote
      };
      renderSingleButtonDispatchModal();
    }

    function renderSingleButtonDispatchModal() {
      const ride = state.rides.find(r => r.id === batchQueue.rideId);
      if (!ride || ride.passengers.length === 0) return;

      const total = ride.passengers.length;
      const idx = batchQueue.index;
      const isDone = idx >= total;
      const currentPassenger = isDone ? ride.passengers[total - 1] : ride.passengers[idx];

      const titles = {
        start: 'Notify All Riders (Ride Started)',
        end: 'Send Thank You to All Riders',
        location: 'Send Live Location to All Riders',
        timeUpdate: 'Send Time Update to All Riders',
        cancelled: 'Send Cancellation to All Riders',
        custom: 'Send Custom Update to All Riders'
      };

      const buildMsgForPassenger = (p) => {
        const vars = {
          name: p.name,
          rideName: ride.routeName,
          pickup: p.pickup,
          drop: p.drop,
          amount: p.fare,
          date: formatDateDisplay(ride.date),
          time: formatTime12Hr(ride.time)
        };
        if (batchQueue.mode === 'start') return compileMessage(state.settings.msgStart, vars);
        if (batchQueue.mode === 'end') return compileMessage(state.settings.msgEnd, vars);
        if (batchQueue.mode === 'timeUpdate') return compileMessage(state.settings.msgTimeUpdate, vars);
        if (batchQueue.mode === 'cancelled') return compileMessage(state.settings.msgCancelled, vars);
        if (batchQueue.mode === 'custom') return `Hi ${p.name} (${ride.routeName}): ${batchQueue.customNote}`;
        return `Hi ${p.name}, follow my live moving location for ${ride.routeName} here: ${batchQueue.extraLink}`;
      };

      const previewMsg = buildMsgForPassenger(currentPassenger);
      const waUrl = buildWhatsAppUrl(currentPassenger.phone, previewMsg);

      const groupMsg = buildMsgForPassenger({
        name: 'Everyone',
        pickup: 'your pickup points',
        drop: '',
        fare: ''
      });
      const groupShareUrl = state.settings.groupLink
        ? `https://wa.me/?text=${encodeURIComponent(groupMsg)}`
        : '';

      const progressPills = ride.passengers.map((p, i) => {
        let style = 'bg-gray-100 text-gray-500';
        if (i < idx) style = 'bg-emerald-100 text-emerald-700 font-bold';
        else if (i === idx && !isDone) style = 'bg-blue-600 text-white font-bold';
        return `<span class="text-[11px] px-2.5 py-1 rounded-full ${style}">${i < idx ? 'Sent: ' : ''}${p.name.split(' ')[0]}</span>`;
      }).join('');

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">${titles[batchQueue.mode] || 'Notify Riders'}</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>

          <div class="flex flex-wrap gap-1.5">
            ${progressPills}
          </div>

          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3.5 space-y-1.5">
            <p class="text-[11px] font-semibold text-gray-500 uppercase">Message Preview (${isDone ? 'All Sent' : `Rider ${idx + 1} of ${total}: ${currentPassenger.name}`})</p>
            <p class="text-xs text-gray-800 bg-white p-2.5 rounded-xl border border-gray-100 select-all">${previewMsg}</p>
          </div>

          ${!isDone ? `
            <a href="${waUrl}" target="_blank" rel="noopener noreferrer" onclick="advanceSingleButtonQueue()" class="w-full bg-emerald-600 active:bg-emerald-700 text-white text-sm font-bold py-3.5 rounded-2xl shadow-sm flex items-center justify-center gap-2">
              ${ICONS.send} Send to ${currentPassenger.name} (${idx + 1}/${total})
            </a>
          ` : `
            <button onclick="closeModal()" class="w-full bg-gray-900 text-white text-sm font-bold py-3.5 rounded-2xl">
              All ${total} Riders Notified &mdash; Done
            </button>
          `}

          ${groupShareUrl ? `
            <div class="pt-1 border-t border-gray-100 text-center">
              <a href="${groupShareUrl}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold text-blue-600">
                Or pick your Carpool WhatsApp Group to send once &rarr;
              </a>
            </div>
          ` : ''}
        </div>
      `);
    }

    function advanceSingleButtonQueue() {
      setTimeout(() => {
        batchQueue.index += 1;
        renderSingleButtonDispatchModal();
      }, 450);
    }

    function openLiveLocationModal(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">Share Moving Live Location</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>

          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3.5 space-y-2.5">
            <p class="text-xs font-bold text-gray-900">Option 1: Google / Apple Maps Live Trip Link</p>
            <p class="text-[11px] text-gray-500">1. Start navigation in Google Maps or Apple Maps &rarr; tap <strong>Share Trip Progress</strong> &rarr; Copy Link.<br>2. Paste below to send your real-time moving route to all riders:</p>
            <input type="url" id="liveTripUrlInput" value="${ride.liveMapLink || ''}" placeholder="Paste maps.app.goo.gl/... live link here" class="w-full bg-white border border-gray-200 rounded-xl px-3 py-2 text-xs">
            <button onclick="sendPastedLiveLink('${ride.id}')" class="w-full bg-blue-600 active:bg-blue-700 text-white text-xs font-bold py-2.5 rounded-xl shadow-xs">
              Send Live Trip Link to All Riders
            </button>
          </div>

          <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3.5 space-y-2">
            <p class="text-xs font-bold text-gray-900">Option 2: WhatsApp Native Live Location</p>
            <p class="text-[11px] text-gray-500">Opens WhatsApp directly so you can tap <strong>+ &rarr; Location &rarr; Share Live Location</strong> inside your chat:</p>
            <a href="https://wa.me/" target="_blank" rel="noopener noreferrer" class="w-full bg-emerald-600 active:bg-emerald-700 text-white text-xs font-bold py-2.5 rounded-xl flex items-center justify-center gap-1.5">
              Open WhatsApp App
            </a>
          </div>
        </div>
      `);
    }

    function sendPastedLiveLink(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;
      const url = document.getElementById('liveTripUrlInput').value.trim();
      if (!url) {
        alert('Please paste your Google Maps or Apple Maps live trip link first.');
        return;
      }
      ride.liveMapLink = url;
      saveState();
      initSingleButtonDispatch(rideId, 'location', url);
    }

    /*****************************************************************
     * 10. UNIFIED RIDE SCHEDULER / EDITOR
     *****************************************************************/
    function openModal(html) {
      document.getElementById('modalContent').innerHTML = html;
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
    }

    function openRideFormModal(editRideId = null) {
      if (state.routes.length === 0) {
        alert('Please add at least one Route in Setup -> Routes DB first.');
        switchTab('setup');
        return;
      }

      const existing = editRideId ? state.rides.find(r => r.id === editRideId) : null;
      const defaultRoute = existing
        ? (state.routes.find(rt => rt.id === existing.routeId) || state.routes[0])
        : state.routes[0];

      const routeOptions = state.routes.map(rt => `
        <option value="${rt.id}"
          data-time="${rt.defaultTime}"
          data-toll="${rt.defaultToll || 0}"
          data-from="${rt.fromPoint || ''}"
          data-to="${rt.toPoint || ''}"
          data-cap="${rt.capacity || 4}"
          data-return="${rt.isReturn ? '1' : '0'}"
          ${defaultRoute && rt.id === defaultRoute.id ? 'selected' : ''}>
          ${rt.name} ${rt.isReturn ? '(Return Swap)' : ''}
        </option>
      `).join('');

      const riderCheckboxes = state.riders.map(r => {
        const existingP = existing ? existing.passengers.find(p => p.riderId === r.id) : null;
        const isChecked = !!existingP;

        const autoSwap = !existing && defaultRoute && defaultRoute.isReturn;
        const initPickup = existingP ? existingP.pickup : (autoSwap ? r.drop : r.pickup);
        const initDrop = existingP ? existingP.drop : (autoSwap ? r.pickup : r.drop);
        const initFare = existingP ? existingP.fare : r.defaultFare;
        const initPaid = existingP ? existingP.paid : false;
        const initPaidAmt = existingP ? existingP.paidAmount : r.defaultFare;
        const initPayMode = existingP ? (existingP.payMode || 'UPI') : 'UPI';

        return `
          <div class="border border-gray-200 rounded-2xl p-3 space-y-2 bg-gray-50/60">
            <div class="flex items-center justify-between">
              <label class="flex items-center gap-2.5 cursor-pointer flex-1">
                <input type="checkbox" class="sched-rider-cb w-5 h-5 rounded accent-blue-600" value="${r.id}" ${isChecked ? 'checked' : ''} onchange="toggleRiderOverride('${r.id}', this.checked)">
                <div>
                  <p class="text-sm font-bold text-gray-900">${r.name} ${r.company ? `<span class="text-[10px] font-normal text-gray-500">(${r.company})</span>` : ''}</p>
                  <p class="text-[11px] text-gray-500">${initPickup} ${ICONS.arrowRight} ${initDrop}</p>
                </div>
              </label>
              <span class="text-xs font-bold text-blue-600">${formatCurrency(initFare)}</span>
            </div>

            <div id="override_${r.id}" class="${isChecked ? '' : 'hidden'} space-y-2 pt-2 border-t border-gray-200/80">
              <div class="flex items-center gap-1.5">
                <input type="text" id="ov_pickup_${r.id}" value="${initPickup}" class="flex-1 bg-white border border-gray-200 rounded-lg px-2 py-1 text-[11px]" placeholder="Pickup">
                <button type="button" onclick="swapSingleRiderPoints('${r.id}')" class="bg-gray-200 text-gray-700 p-1 rounded-lg" title="Swap Pickup & Drop">${ICONS.swap}</button>
                <input type="text" id="ov_drop_${r.id}" value="${initDrop}" class="flex-1 bg-white border border-gray-200 rounded-lg px-2 py-1 text-[11px]" placeholder="Drop">
              </div>
              <div class="grid grid-cols-3 gap-1.5 items-center">
                <div>
                  <span class="text-[9px] text-gray-400 uppercase block">Fare (${RS})</span>
                  <input type="number" id="ov_fare_${r.id}" value="${initFare}" class="w-full bg-white border border-gray-200 rounded-lg px-2 py-1 text-[11px] font-bold">
                </div>
                <div>
                  <span class="text-[9px] text-gray-400 uppercase block">Paid?</span>
                  <label class="flex items-center gap-1.5 bg-white border border-gray-200 rounded-lg px-2 py-1 text-[11px] font-semibold">
                    <input type="checkbox" id="ov_paid_${r.id}" ${initPaid ? 'checked' : ''} class="accent-emerald-600"> Paid
                  </label>
                </div>
                <div>
                  <span class="text-[9px] text-gray-400 uppercase block">Paid Amt</span>
                  <input type="number" id="ov_paidamt_${r.id}" value="${initPaidAmt}" class="w-full bg-white border border-gray-200 rounded-lg px-2 py-1 text-[11px]">
                </div>
              </div>
              <input type="hidden" id="ov_paymode_${r.id}" value="${initPayMode}">
            </div>
          </div>
        `;
      }).join('');

      const initFrom = existing ? (existing.fromPoint || '') : (defaultRoute.fromPoint || '');
      const initTo = existing ? (existing.toPoint || '') : (defaultRoute.toPoint || '');
      const initToll = existing ? (existing.tollCost ?? 0) : (defaultRoute.defaultToll || 0);
      const initCap = existing ? (existing.capacity || 4) : (defaultRoute.capacity || 4);
      const initStatus = existing ? existing.status : 'scheduled';
      const selectedCount = existing ? existing.passengers.length : 0;

      openModal(`
        <div class="space-y-3.5">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">${existing ? 'Edit / Manage Ride' : 'Schedule or Log Ride'}</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Ride Name / Route</label>
              <select id="schedRoute" onchange="onSchedRouteChange()" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-2.5 py-2 text-xs font-semibold outline-none">
                ${routeOptions}
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Ride Status</label>
              <select id="schedStatus" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-2.5 py-2 text-xs font-semibold outline-none">
                <option value="scheduled" ${initStatus === 'scheduled' ? 'selected' : ''}>Scheduled (Upcoming)</option>
                <option value="active" ${initStatus === 'active' ? 'selected' : ''}>In Progress</option>
                <option value="completed" ${initStatus === 'completed' ? 'selected' : ''}>Completed (Past Ride)</option>
              </select>
            </div>
          </div>

          <div class="flex items-center gap-1.5">
            <div class="flex-1">
              <label class="block text-[10px] font-semibold text-gray-500 uppercase mb-0.5">From</label>
              <input type="text" id="schedFrom" value="${initFrom}" placeholder="Origin" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-2.5 py-1.5 text-xs">
            </div>
            <button type="button" onclick="swapAllRidePoints()" class="mt-4 bg-blue-50 text-blue-600 border border-blue-200 p-2 rounded-xl" title="Swap From/To & All Riders">${ICONS.swap}</button>
            <div class="flex-1">
              <label class="block text-[10px] font-semibold text-gray-500 uppercase mb-0.5">To</label>
              <input type="text" id="schedTo" value="${initTo}" placeholder="Destination" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-2.5 py-1.5 text-xs">
            </div>
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div>
              <label class="block text-[10px] font-semibold text-gray-500 uppercase mb-0.5">Date</label>
              <input type="date" id="schedDate" value="${existing ? existing.date : todayStr()}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-2 py-1.5 text-xs">
            </div>
            <div>
              <label class="block text-[10px] font-semibold text-gray-500 uppercase mb-0.5">Start Time</label>
              <input type="time" id="schedTime" value="${existing ? existing.time : defaultRoute.defaultTime}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-2 py-1.5 text-xs">
            </div>
            <div>
              <label class="block text-[10px] font-semibold text-gray-500 uppercase mb-0.5">Default Toll (${RS})</label>
              <input type="number" id="schedToll" value="${initToll}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-2 py-1.5 text-xs font-bold">
            </div>
          </div>

          <input type="hidden" id="schedCap" value="${initCap}">

          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="text-xs font-semibold text-gray-600">Riders (Optional now, add anytime)</label>
              <span id="seatCounterBadge" class="text-[11px] font-bold text-blue-600">${selectedCount} / ${initCap} seats</span>
            </div>
            <div class="space-y-2 max-h-56 overflow-y-auto pr-0.5">
              ${riderCheckboxes || '<p class="text-xs text-gray-400 text-center py-3">No riders in DB yet. You can still schedule now and add riders later.</p>'}
            </div>
          </div>

          <button onclick="saveRideForm('${editRideId || ''}')" class="w-full bg-blue-600 active:bg-blue-700 text-white font-semibold py-3 rounded-2xl shadow-sm">
            ${existing ? 'Update Ride Details' : 'Save Ride'}
          </button>
        </div>
      `);
    }

    function onSchedRouteChange() {
      const sel = document.getElementById('schedRoute');
      const opt = sel.options[sel.selectedIndex];
      if (!opt) return;
      document.getElementById('schedTime').value = opt.dataset.time || '08:30';
      document.getElementById('schedToll').value = opt.dataset.toll || '0';
      document.getElementById('schedFrom').value = opt.dataset.from || '';
      document.getElementById('schedTo').value = opt.dataset.to || '';
      document.getElementById('schedCap').value = opt.dataset.cap || '4';

      const isReturn = opt.dataset.return === '1';
      state.riders.forEach(r => {
        const pEl = document.getElementById(`ov_pickup_${r.id}`);
        const dEl = document.getElementById(`ov_drop_${r.id}`);
        if (pEl && dEl) {
          pEl.value = isReturn ? r.drop : r.pickup;
          dEl.value = isReturn ? r.pickup : r.drop;
        }
      });
    }

    function swapSingleRiderPoints(riderId) {
      const pEl = document.getElementById(`ov_pickup_${riderId}`);
      const dEl = document.getElementById(`ov_drop_${riderId}`);
      if (pEl && dEl) {
        const tmp = pEl.value;
        pEl.value = dEl.value;
        dEl.value = tmp;
      }
    }

    function swapAllRidePoints() {
      const fEl = document.getElementById('schedFrom');
      const tEl = document.getElementById('schedTo');
      if (fEl && tEl) {
        const tmp = fEl.value;
        fEl.value = tEl.value;
        tEl.value = tmp;
      }
      state.riders.forEach(r => swapSingleRiderPoints(r.id));
      showToast('Swapped Pickup & Drop points!');
    }

    function toggleRiderOverride(riderId, checked) {
      const box = document.getElementById(`override_${riderId}`);
      if (checked) box.classList.remove('hidden');
      else box.classList.add('hidden');

      const count = document.querySelectorAll('.sched-rider-cb:checked').length;
      const cap = document.getElementById('schedCap').value || 4;
      document.getElementById('seatCounterBadge').textContent = `${count} / ${cap} seats`;
    }

    function saveRideForm(editRideId) {
      const routeId = document.getElementById('schedRoute').value;
      const routeObj = state.routes.find(r => r.id === routeId);
      const status = document.getElementById('schedStatus').value;
      const fromPoint = document.getElementById('schedFrom').value.trim();
      const toPoint = document.getElementById('schedTo').value.trim();
      const date = document.getElementById('schedDate').value || todayStr();
      const time = document.getElementById('schedTime').value || '08:30';
      const tollCost = parseFloat(document.getElementById('schedToll').value) || 0;
      const capacity = parseInt(document.getElementById('schedCap').value, 10) || (routeObj ? routeObj.capacity : 4);

      const checkedBoxes = Array.from(document.querySelectorAll('.sched-rider-cb:checked'));
      const passengers = checkedBoxes.map(cb => {
        const rid = cb.value;
        const base = state.riders.find(r => r.id === rid);
        const fare = parseFloat(document.getElementById(`ov_fare_${rid}`).value) || base.defaultFare;
        const isPaid = document.getElementById(`ov_paid_${rid}`).checked;
        const paidAmt = parseFloat(document.getElementById(`ov_paidamt_${rid}`).value) || 0;
        const payMode = document.getElementById(`ov_paymode_${rid}`).value || 'UPI';

        return {
          riderId: rid,
          name: base.name,
          phone: base.phone,
          company: base.company || '',
          pickup: document.getElementById(`ov_pickup_${rid}`).value.trim() || base.pickup,
          drop: document.getElementById(`ov_drop_${rid}`).value.trim() || base.drop,
          fare,
          paid: isPaid,
          paidAmount: isPaid ? (paidAmt > 0 ? paidAmt : fare) : 0,
          payMode
        };
      });

      if (editRideId) {
        const idx = state.rides.findIndex(r => r.id === editRideId);
        if (idx !== -1) {
          state.rides[idx] = {
            ...state.rides[idx],
            routeId,
            routeName: routeObj ? routeObj.name : state.rides[idx].routeName,
            fromPoint,
            toPoint,
            date,
            time,
            capacity,
            tollCost,
            status,
            passengers
          };
        }
        showToast('Ride updated!');
      } else {
        state.rides.unshift({
          id: 'ride_' + Date.now(),
          routeId,
          routeName: routeObj ? routeObj.name : 'Carpool Ride',
          fromPoint,
          toPoint,
          date,
          time,
          capacity,
          tollCost,
          status,
          liveMapLink: '',
          passengers
        });
        ridesFilter = status === 'completed' ? 'completed' : 'upcoming';
        showToast(status === 'completed' ? 'Past ride logged!' : 'Ride scheduled!');
      }

      closeModal();
      currentTab = 'rides';
      saveState();
    }

    /*****************************************************************
     * 11. END RIDE SETTLEMENT MODAL
     *****************************************************************/
    function openSettlementModal(rideId) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;

      const rows = ride.passengers.length === 0
        ? `<p class="text-xs text-gray-400 text-center py-3">No riders were added to this ride.</p>`
        : ride.passengers.map((p, idx) => {
            const defaultVal = p.paidAmount > 0 ? p.paidAmount : p.fare;
            return `
              <div class="bg-gray-50 border border-gray-200 rounded-2xl p-3 space-y-2">
                <div class="flex items-center justify-between">
                  <label class="flex items-center gap-2.5 cursor-pointer">
                    <input type="checkbox" id="settle_paid_${idx}" ${p.paid ? 'checked' : ''} class="w-5 h-5 rounded accent-emerald-600">
                    <div>
                      <p class="text-sm font-bold text-gray-900">${p.name}</p>
                      <p class="text-[11px] text-gray-500">Default Fare: ${formatCurrency(p.fare)}</p>
                    </div>
                  </label>
                  <span class="text-xs font-semibold text-gray-500">Paid?</span>
                </div>
                <div class="grid grid-cols-2 gap-2 pt-1">
                  <div>
                    <label class="text-[10px] font-semibold text-gray-500 uppercase">Amount (${RS})</label>
                    <input type="number" id="settle_amt_${idx}" value="${defaultVal}" class="w-full bg-white border border-gray-200 rounded-xl px-2.5 py-1.5 text-sm font-bold">
                  </div>
                  <div>
                    <label class="text-[10px] font-semibold text-gray-500 uppercase">Mode</label>
                    <select id="settle_mode_${idx}" class="w-full bg-white border border-gray-200 rounded-xl px-2.5 py-1.5 text-sm">
                      <option value="UPI" ${p.payMode === 'UPI' ? 'selected' : ''}>UPI</option>
                      <option value="Cash" ${p.payMode === 'Cash' ? 'selected' : ''}>Cash</option>
                      <option value="Bank" ${p.payMode === 'Bank' ? 'selected' : ''}>Bank</option>
                    </select>
                  </div>
                </div>
              </div>
            `;
          }).join('');

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <div>
              <h3 class="text-lg font-bold">Ride Settlement &amp; Toll</h3>
              <p class="text-xs text-gray-500">${ride.routeName} &bull; ${formatDateDisplay(ride.date)}</p>
            </div>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>

          <div class="bg-amber-50/80 border border-amber-200 rounded-2xl p-3 flex items-center justify-between gap-3">
            <div>
              <p class="text-xs font-bold text-amber-900">Toll Charges Paid (${RS})</p>
              <p class="text-[10px] text-amber-700">Pre-filled from schedule (enter 0 if no toll)</p>
            </div>
            <input type="number" id="settleTollInput" value="${ride.tollCost ?? 0}" class="w-24 bg-white border border-amber-300 rounded-xl px-2.5 py-2 text-sm font-bold text-right">
          </div>

          <div class="space-y-2.5 max-h-60 overflow-y-auto">${rows}</div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="saveSettlement('${ride.id}', false)" class="bg-blue-600 active:bg-blue-700 text-white text-xs font-semibold py-3 rounded-2xl shadow-xs">
              Save Settlement
            </button>
            <button onclick="saveSettlement('${ride.id}', true)" class="bg-emerald-600 active:bg-emerald-700 text-white text-xs font-semibold py-3 rounded-2xl shadow-xs">
              Save &amp; Thank All
            </button>
          </div>
        </div>
      `);
    }

    function saveSettlement(rideId, triggerThankYou) {
      const ride = state.rides.find(r => r.id === rideId);
      if (!ride) return;

      ride.tollCost = parseFloat(document.getElementById('settleTollInput').value) || 0;

      ride.passengers.forEach((p, idx) => {
        const isPaid = document.getElementById(`settle_paid_${idx}`).checked;
        const amt = parseFloat(document.getElementById(`settle_amt_${idx}`).value) || 0;
        const mode = document.getElementById(`settle_mode_${idx}`).value;

        p.paid = isPaid;
        p.paidAmount = isPaid ? amt : 0;
        p.payMode = mode;
      });

      saveState();
      if (triggerThankYou && ride.passengers.length > 0) {
        initSingleButtonDispatch(rideId, 'end');
      } else {
        closeModal();
        showToast('Settlement & toll saved!');
      }
    }

    /*****************************************************************
     * 12. FUEL & ODOMETER LOG TAB
     *****************************************************************/
    function renderFuel() {
      const sorted = [...state.fuelLogs].sort((a, b) => a.odometer - b.odometer);
      const totalSpent = sorted.reduce((s, f) => s + (Number(f.totalCost) || 0), 0);
      const totalLiters = sorted.reduce((s, f) => s + (Number(f.liters) || 0), 0);

      let totalDist = 0;
      let mileageStr = '--';
      let costPerKmStr = '--';

      if (sorted.length >= 2) {
        totalDist = sorted[sorted.length - 1].odometer - sorted[0].odometer;
        const litersAfterFirst = sorted.slice(1).reduce((s, f) => s + (Number(f.liters) || 0), 0);
        const costAfterFirst = sorted.slice(1).reduce((s, f) => s + (Number(f.totalCost) || 0), 0);
        if (totalDist > 0 && litersAfterFirst > 0) {
          mileageStr = (totalDist / litersAfterFirst).toFixed(1) + ' km/L';
          costPerKmStr = RS + (costAfterFirst / totalDist).toFixed(2) + '/km';
        }
      }

      const displayList = [...sorted].reverse().map((entry, idx, arr) => {
        const prev = arr[idx + 1];
        const dist = prev ? entry.odometer - prev.odometer : 0;
        const tankMileage = dist > 0 && entry.liters > 0 ? (dist / entry.liters).toFixed(1) + ' km/L' : '';
        const pricePerLiter = entry.liters > 0 ? (entry.totalCost / entry.liters).toFixed(1) : 0;

        return `
          <div class="bg-white rounded-2xl p-3.5 shadow-xs border border-gray-100 flex items-center justify-between">
            <div>
              <div class="flex items-center gap-2">
                <span class="font-bold text-sm text-gray-900">${entry.odometer.toLocaleString()} km</span>
                ${dist > 0 ? `<span class="text-[11px] bg-blue-50 text-blue-600 font-semibold px-2 py-0.5 rounded-md">+${dist} km (${tankMileage})</span>` : ''}
              </div>
              <p class="text-xs text-gray-500 mt-0.5">${formatDateDisplay(entry.date)} &bull; ${entry.liters} L @ ${RS}${pricePerLiter}/L</p>
            </div>
            <div class="flex items-center gap-2.5">
              <span class="font-bold text-sm text-gray-900">${formatCurrency(entry.totalCost)}</span>
              <button onclick="deleteFuel('${entry.id}')" class="text-red-400 hover:text-red-600 p-1.5 rounded-lg" aria-label="Delete Fuel">
                ${ICONS.trash}
              </button>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="grid grid-cols-2 gap-3">
          <div class="bg-white rounded-2xl p-3.5 shadow-xs border border-gray-100">
            <p class="text-[11px] font-semibold text-gray-400 uppercase">Avg Mileage</p>
            <p class="text-xl font-bold text-emerald-600 mt-0.5">${mileageStr}</p>
            <p class="text-[11px] text-gray-500 mt-0.5">Running: ${costPerKmStr}</p>
          </div>
          <div class="bg-white rounded-2xl p-3.5 shadow-xs border border-gray-100">
            <p class="text-[11px] font-semibold text-gray-400 uppercase">Total Fuel Cost</p>
            <p class="text-xl font-bold text-gray-900 mt-0.5">${formatCurrency(totalSpent)}</p>
            <p class="text-[11px] text-gray-500 mt-0.5">${totalLiters.toFixed(1)} L &bull; ${totalDist} km</p>
          </div>
        </div>

        <div class="space-y-2.5">
          <h2 class="text-xs font-bold uppercase tracking-wider text-gray-500 px-1">Refuel History (${sorted.length})</h2>
          ${displayList || '<p class="text-xs text-gray-400 text-center py-6 bg-white rounded-2xl">No fuel entries yet. Tap "+ Log Fuel" above.</p>'}
        </div>
      `;
    }

    function openFuelModal() {
      const lastOdo = state.fuelLogs.length > 0
        ? Math.max(...state.fuelLogs.map(f => Number(f.odometer) || 0))
        : '';

      openModal(`
        <div class="space-y-4">
          <div class="flex items-center justify-between">
            <h3 class="text-lg font-bold">Log Fuel &amp; Odometer</h3>
            <button onclick="closeModal()" class="text-gray-400 p-1">${ICONS.close}</button>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Date</label>
              <input type="date" id="fuelDate" value="${todayStr()}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Odometer (km)</label>
              <input type="number" id="fuelOdo" placeholder="${lastOdo ? 'Last: ' + lastOdo : 'e.g. 43100'}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-sm font-semibold">
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Fuel Liters (L)</label>
              <input type="number" step="0.01" id="fuelLiters" placeholder="e.g. 25.5" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-gray-600 mb-1">Total Price (${RS})</label>
              <input type="number" id="fuelCost" placeholder="e.g. 2750" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 text-sm font-semibold">
            </div>
          </div>

          <button onclick="saveFuelEntry()" class="w-full bg-blue-600 active:bg-blue-700 text-white font-semibold py-3 rounded-2xl shadow-sm">
            Save Fuel Log
          </button>
        </div>
      `);
    }

    function saveFuelEntry() {
      const date = document.getElementById('fuelDate').value || todayStr();
      const odometer = parseFloat(document.getElementById('fuelOdo').value) || 0;
      const liters = parseFloat(document.getElementById('fuelLiters').value) || 0;
      const totalCost = parseFloat(document.getElementById('fuelCost').value) || 0;

      if (odometer <= 0 || totalCost <= 0) {
        alert('Please enter a valid odometer reading and total price.');
        return;
      }

      state.fuelLogs.push({
        id: 'fuel_' + Date.now(),
        date,
        odometer,
        liters,
        totalCost

    function downloadBackupJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `CarpoolPro_Backup_${todayStr()}.json`;
      a.click();
      showToast('Backup JSON downloaded');
    }

    function restoreBackupJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const imported = JSON.parse(e.target.result);
          if (imported.riders && imported.rides) {
            state = imported;
            saveState();
            showToast('Backup restored & synced!');
          } else {
            alert('Invalid backup file format.');
          }
        } catch (err) {
          alert('Could not read JSON file.');
        }
      };
      reader.readAsText(file);
    }

    function exportRidesCSV() {
      let csv = 'Date,Time,Ride Name,From,To,Toll,Status,Rider Name,Company,Phone,Pickup,Drop,Fare,Paid,Paid Amount,Payment Mode\n';
      state.rides.forEach(ride => {
        if (ride.passengers.length === 0) {
          csv += `"${ride.date}","${ride.time}","${ride.routeName}","${ride.fromPoint || ''}","${ride.toPoint || ''}",${ride.tollCost || 0},"${ride.status}","", "", "", "", "",0,No,0,""\n`;
        } else {
          ride.passengers.forEach(p => {
            csv += `"${ride.date}","${ride.time}","${ride.routeName}","${ride.fromPoint || ''}","${ride.toPoint || ''}",${ride.tollCost || 0},"${ride.status}","${p.name}","${p.company || ''}","${p.phone}","${p.pickup}","${p.drop}",${p.fare},${p.paid ? 'Yes' : 'No'},${p.paidAmount || 0},"${p.payMode || ''}"\n`;
          });
        }
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `CarpoolPro_Ledger_${todayStr()}.csv`;
      a.click();
      showToast('CSV exported');
    }

        riders: [],
        routes: [
          { id: 'rt1', name: 'Office Ride (Morning)', fromPoint: 'Home', toPoint: 'Office', defaultTime: '08:30', capacity: 4, defaultToll: 0, isReturn: false },
          { id: 'rt2', name: 'Return Ride (Evening)', fromPoint: 'Office', toPoint: 'Home', defaultTime: '18:30', capacity: 4, defaultToll: 0, isReturn: true }
        ],
        rides: [],
        fuelLogs: [],
        settings: state.settings
      };
      saveState();
      showToast('All records cleared');
    }
