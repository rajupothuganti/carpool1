<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Carpool Pro</title>

  <!-- iOS Web App / PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Carpool Pro" />
  <meta name="theme-color" content="#F2F2F7" />

  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase Compat SDKs (Auth + Firestore) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --ios-bg: #F2F2F7;
      --ios-card: #FFFFFF;
      --ios-blue: #007AFF;
    }
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    body {
      background-color: var(--ios-bg);
      color: #1C1C1E;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      overscroll-behavior-y: none;
    }
    .safe-top {
      padding-top: max(env(safe-area-inset-top), 14px);
    }
    .safe-bottom {
      padding-bottom: max(env(safe-area-inset-bottom), 14px);
    }
    .glass-header {
      background: rgba(242, 242, 247, 0.88);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .glass-tabbar {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @keyframes slideUp {
      from { transform: translateY(100%); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    .animate-sheet {
      animation: slideUp 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col select-none">

  <!-- AUTHENTICATION SCREEN (Shown when signed out) -->
  <div id="authScreen" class="hidden fixed inset-0 z-50 bg-[#F2F2F7] flex flex-col justify-center px-5 safe-top safe-bottom overflow-y-auto">
    <div class="w-full max-w-sm mx-auto space-y-5">
      <div class="text-center space-y-1.5">
        <div class="w-14 h-14 bg-blue-600 text-white rounded-2xl mx-auto flex items-center justify-center shadow-md">
          <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h8m-8 4h8m-6 4h4M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-gray-900">Carpool Pro</h1>
        <p class="text-xs text-gray-500">Sign in to sync your rides, payments &amp; fuel logs across all devices</p>
      </div>

      <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100 space-y-3.5">
        <div class="grid grid-cols-2 bg-gray-100 p-1 rounded-xl text-xs font-semibold">
          <button type="button" id="authTabLogin" onclick="switchAuthMode('login')" class="py-2 rounded-lg bg-white text-gray-900 shadow-xs">Sign In</button>
          <button type="button" id="authTabSignup" onclick="switchAuthMode('signup')" class="py-2 rounded-lg text-gray-500">Create Account</button>
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Email Address</label>
          <input type="email" id="authEmail" placeholder="you@gmail.com" autocomplete="email" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-gray-600 mb-1">Password</label>
          <input type="password" id="authPassword" placeholder="Minimum 6 characters" autocomplete="current-password" class="w-full bg-gray-50 border border-gray-200 rounded-xl px-3.5 py-2.5 text-sm outline-none focus:border-blue-500">
        </div>

        <p id="authErrorMsg" class="hidden text-xs text-red-600 bg-red-50 border border-red-100 rounded-xl p-2.5"></p>

        <button type="button" id="authSubmitBtn" onclick="handleAuthSubmit()" class="w-full bg-blue-600 active:bg-blue-700 text-white text-sm font-bold py-3 rounded-2xl shadow-sm">
          Sign In
        </button>

        <div class="text-center pt-1">
          <button type="button" onclick="handleForgotPassword()" class="text-xs font-semibold text-blue-600">Forgot Password?</button>
        </div>
      </div>

      <p class="text-[11px] text-center text-gray-400 px-4">
        First time signing in on this iPhone? Your existing local rides and riders will automatically upload to your cloud account.
      </p>
    </div>
  </div>

  <!-- MAIN APP SHELL -->
  <div id="appShell" class="hidden flex-1 flex flex-col">
    <!-- Top Sticky Header -->
    <header class="sticky top-0 z-30 glass-header border-b border-gray-200/80 safe-top px-4 pb-3">
      <div class="max-w-lg mx-auto flex items-center justify-between">
        <div>
          <div class="flex items-center gap-2">
            <p id="headerSubtitle" class="text-[11px] font-semibold uppercase tracking-wider text-gray-500">Analytics &amp; Ledger</p>
            <span id="cloudStatusBadge" class="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700">Cloud Synced</span>
          </div>
          <h1 id="headerTitle" class="text-2xl font-bold tracking-tight text-gray-900">Dashboard</h1>
        </div>
        <div id="headerActionArea"></div>
      </div>
    </header>

    <!-- Main Scrollable Content -->
    <main id="appMain" class="flex-1 w-full max-w-lg mx-auto px-4 pt-4 pb-28 space-y-4">
      <!-- Rendered dynamically by JS -->
    </main>

    <!-- Bottom iOS Tab Bar -->
    <nav class="fixed bottom-0 left-0 right-0 z-30 glass-tabbar border-t border-gray-200/80 safe-bottom">
      <div class="max-w-lg mx-auto grid grid-cols-4 pt-1.5 pb-1">
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="flex flex-col items-center justify-center gap-0.5 py-1 text-blue-600">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
          <span class="text-[10px] font-semibold">Dashboard</span>
        </button>
        <button onclick="switchTab('rides')" id="tab-rides" class="flex flex-col items-center justify-center gap-0.5 py-1 text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7h8m-8 4h8m-6 4h4M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>
          <span class="text-[10px] font-semibold">Rides</span>
        </button>
        <button onclick="switchTab('fuel')" id="tab-fuel" class="flex flex-col items-center justify-center gap-0.5 py-1 text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg>
          <span class="text-[10px] font-semibold">Fuel</span>
        </button>
        <button onclick="switchTab('setup')" id="tab-setup" class="flex flex-col items-center justify-center gap-0.5 py-1 text-gray-400">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><circle cx="12" cy="12" r="3"/></svg>
          <span class="text-[10px] font-semibold">Setup</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- Universal Modal Container -->
  <div id="modalBackdrop" class="hidden fixed inset-0 z-50 bg-black/45 backdrop-blur-xs flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div id="modalContent" class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 max-h-[92vh] overflow-y-auto safe-bottom animate-sheet shadow-2xl">
      <!-- Dynamic Modal Inner Content -->
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-gray-900/95 text-white text-xs font-medium px-4 py-2.5 rounded-full shadow-lg transition-opacity text-center max-w-[90vw]"></div>

  <script>
    /*****************************************************************
     * 1. YOUR FIREBASE CONFIG KEYS (PRE-CONFIGURED)
     *****************************************************************/
    const firebaseConfig = {
      apiKey: "AIzaSyCXAzRVEBNyeD3KXpSuFIO6xQ5nCDLt11g",
      authDomain: "carpool-pro-8b45f.firebaseapp.com",
      projectId: "carpool-pro-8b45f",
      storageBucket: "carpool-pro-8b45f.firebasestorage.app",
      messagingSenderId: "995182008179",
      appId: "1:995182008179:web:b74f0ac3b4ec0555b49706",
      measurementId: "G-J3R9167DP6"
    };

    /*****************************************************************
     * 2. SAFE UNICODE SYMBOLS & SVG ICONS
     *****************************************************************/
    const RS = '\u20B9';
    const EMOJI = {
      car: '\uD83D\uDE99',
      user: '\uD83D\uDC64',
      cal: '\uD83D\uDCC5',
      clock: '\u23F0',
      pin: '\uD83D\uDCCD',
      seat: '\uD83E\uDE91',
      phone: '\uD83D\uDCDE',
      sedan: '\uD83D\uDE98',
      point: '\uD83D\uDC49',
      pray: '\uD83D\uDE4F',
      smile: '\uD83D\uDE0A'
    };

    const ICONS = {
      trash: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>',
      close: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>',
      play: '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
      stop: '<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>',
      pin: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>',
      send: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>',
      arrowRight: '<svg class="w-3 h-3 inline mx-0.5 text-gray-400" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>',
      swap: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16V4m0 0L3 8m4-4l4 4m6 0v12m0 0l4-4m-4 4l-4-4"/></svg>',
      edit: '<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>',
      check: '<svg class="w-3.5 h-3.5 inline" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/></svg>',
      chevron: '<svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>',
      cloud: '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>'
    };

    function formatCurrency(num) {
      return RS + Math.round(num || 0).toLocaleString('en-IN');
    }

    /*****************************************************************
     * 3. STATE, FIREBASE AUTH & FIRESTORE REAL-TIME SYNC
     *****************************************************************/
    const STORAGE_KEY = 'carpool_pro_v3';
    const todayStr = () => new Date().toISOString().slice(0, 10);

    const defaultState = {
      riders: [
        { id: 'r1', name: 'Rahul Sharma', phone: '919876543210', company: 'Tech Mahindra', pickup: 'Turkayamjal', drop: 'Tech Mahindra', defaultFare: 150, shift: '09:00 AM - 06:00 PM', notes: 'Main Gate Pickup' },
        { id: 'r2', name: 'Pooja Reddy', phone: '919876543211', company: 'Infosys', pickup: 'LB Nagar Metro', drop: 'Gachibowli', defaultFare: 180, shift: '09:30 AM - 06:30 PM', notes: '' }
      ],
      routes: [
        { id: 'rt1', name: 'Office Ride (Morning)', fromPoint: 'Turkayamjal', toPoint: 'Tech Mahindra', defaultTime: '08:30', capacity: 4, defaultToll: 60, isReturn: false },
        { id: 'rt2', name: 'Return Ride (Evening)', fromPoint: 'Tech Mahindra', toPoint: 'Turkayamjal', defaultTime: '15:20', capacity: 4, defaultToll: 60, isReturn: true }
      ],
      rides: [],
      fuelLogs: [],
      settings: {
        driverName: 'Raj Reddy',
        driverPhone: '9959344266',
        vehicleInfo: 'Tiago (Blue) 6259',
        adminPhone: '',
        upiId: 'rajreddy@okaxis',
        groupLink: '',
        msgStart: 'Hi {Name}, my {RideName} has started! On my way toward {Pickup}.',
        msgEnd: 'Thank you for riding with me today on {RideName}, {Name}! Ride fare: Rs.{Amount}. UPI: {UPI}',
        msgReminder: 'Hi {Name}, gentle reminder for your pending carpool fare of Rs.{Amount} ({RideName} on {Date}). Please UPI to {UPI}. Thank you!',
        msgTimeUpdate: 'Hi {Name}, update on {RideName} ({Date}): Start time has been updated to {Time}. Please be ready at {Pickup}.',
        msgCancelled: 'Hi {Name}, sorry to inform you that {RideName} scheduled for {Date} at {Time} has been cancelled due to unavoidable reasons.',
        lastSyncedAt: ''
      }
    };

    let state = loadLocalState();
    let currentTab = 'dashboard';
    let dashboardPeriod = 'month';
    let ridesFilter = 'upcoming';
    let setupSubTab = 'riders';
    let authMode = 'login';
    let currentUser = null;
    let firestoreUnsubscribe = null;
    let isApplyingRemoteSnapshot = false;

    let batchQueue = {
      rideId: null,
      mode: 'start',
      index: 0,
      extraLink: '',
      customNote: ''
    };

    function loadLocalState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('carpool_pro_v2') || localStorage.getItem('carpool_pro_v1');
        if (saved) {
          const parsed = JSON.parse(saved);
          return {
            ...defaultState,
            ...parsed,
            settings: { ...defaultState.settings, ...(parsed.settings || {}) }
          };
        }
      } catch (e) {
        console.error('Local load error', e);
      }
      return JSON.parse(JSON.stringify(defaultState));
    }

    function hasMeaningfulLocalData() {
      const saved = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('carpool_pro_v2') || localStorage.getItem('carpool_pro_v1');
      if (!saved) return false;
      try {
        const parsed = JSON.parse(saved);
        return (parsed.rides && parsed.rides.length > 0) || (parsed.fuelLogs && parsed.fuelLogs.length > 0) || (parsed.riders && parsed.riders.length > 2);
      } catch (e) {
        return false;
      }
    }

    function setCloudBadge(status) {
      const badge = document.getElementById('cloudStatusBadge');
      if (!badge) return;
      if (status === 'synced') {
        badge.textContent = 'Cloud Synced';
        badge.className = 'text-[10px] font-semibold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-700';
      } else if (status === 'syncing') {
        badge.textContent = 'Syncing...';
        badge.className = 'text-[10px] font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-700';
      } else {
        badge.textContent = 'Offline Cached';
        badge.className = 'text-[10px] font-semibold px-2 py-0.5 rounded-full bg-gray-200 text-gray-700';
      }
    }

    async function saveState() {
      state.settings.lastSyncedAt = new Date().toISOString();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      renderApp();

      if (currentUser && window.db && !isApplyingRemoteSnapshot) {
        setCloudBadge('syncing');
        try {
          await window.db.collection('users').doc(currentUser.uid).set({
            email: currentUser.email,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            state: JSON.parse(JSON.stringify(state))
          });
          setCloudBadge('synced');
        } catch (err) {
          console.error('Firestore write failed:', err);
          setCloudBadge('offline');
        }
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => el.classList.add('hidden'), 2600);
    }

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    window.auth = firebase.auth();
    window.db = firebase.firestore();
    window.db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

    window.auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('authScreen').classList.add('hidden');
        document.getElementById('appShell').classList.remove('hidden');
        await attachUserCloudListener(user);
      } else {
        currentUser = null;
        if (firestoreUnsubscribe) {
          firestoreUnsubscribe();
          firestoreUnsubscribe = null;
        }
        document.getElementById('appShell').classList.add('hidden');
        document.getElementById('authScreen').classList.remove('hidden');
      }
    });

    async function attachUserCloudListener(user) {
      const docRef = window.db.collection('users').doc(user.uid);
      setCloudBadge('syncing');

      try {
        const initialSnap = await docRef.get();
        if (!initialSnap.exists) {
          const migrated = hasMeaningfulLocalData();
          await docRef.set({
            email: user.email,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
            state: JSON.parse(JSON.stringify(state))
          });
          if (migrated) {
            showToast('Existing iPhone data uploaded to your cloud account!');
          }
        }
      } catch (e) {
        console.error('Initial cloud check error:', e);
      }

      if (firestoreUnsubscribe) firestoreUnsubscribe();
      firestoreUnsubscribe = docRef.onSnapshot((doc) => {
        if (doc.exists && doc.data().state) {
          isApplyingRemoteSnapshot = true;
          const remoteState = doc.data().state;
          state = {
            ...defaultState,
            ...remoteState,
            settings: { ...defaultState.settings, ...(remoteState.settings || {}) }
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          setCloudBadge('synced');
          renderApp();
          isApplyingRemoteSnapshot = false;
        }
      }, (err) => {
        console.error('Snapshot listener error:', err);
        setCloudBadge('offline');
      });
    }

    /*****************************************************************
     * 4. AUTH UI HANDLERS
     *****************************************************************/
    function switchAuthMode(mode) {
      authMode = mode;
      const loginTab = document.getElementById('authTabLogin');
      const signupTab = document.getElementById('authTabSignup');
      const btn = document.getElementById('authSubmitBtn');
      document.getElementById('authErrorMsg').classList.add('hidden');

      if (mode === 'login') {
        loginTab.className = 'py-2 rounded-lg bg-white text-gray-900 shadow-xs';
        signupTab.className = 'py-2 rounded-lg text-gray-500';
        btn.textContent = 'Sign In';
      } else {
        signupTab.className = 'py-2 rounded-lg bg-white text-gray-900 shadow-xs';
        loginTab.className = 'py-2 rounded-lg text-gray-500';
        btn.textContent = 'Create Cloud Account';
      }
    }

    async function handleAuthSubmit() {
      const email = document.getElementById('authEmail').value.trim();
      const password = document.getElementById('authPassword').value;
      const errEl = document.getElementById('authErrorMsg');
      const btn = document.getElementById('authSubmitBtn');

      errEl.classList.add('hidden');
      if (!email || !password) {
        errEl.textContent = 'Please enter both email and password.';
        errEl.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = authMode === 'login' ? 'Signing In...' : 'Creating Account...';

      try {
        if (authMode === 'login') {
          await window.auth.signInWithEmailAndPassword(email, password);
        } else {
          await window.auth.createUserWithEmailAndPassword(email, password);
        }
      } catch (err) {
        errEl.textContent = err.message || 'Authentication failed. Check your email and password.';
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btn.textContent = authMode === 'login' ? 'Sign In' : 'Create Cloud Account';
      }
    }

    async function handleForgotPassword() {
      const email = document.getElementById('authEmail').value.trim();
      const errEl = document.getElementById('authErrorMsg');
      if (!email) {
        errEl.textContent = 'Enter your email address above first, then tap Forgot Password.';
        errEl.classList.remove('hidden');
        return;
      }
      try {
        await window.auth.sendPasswordResetEmail(email);
        showToast('Password reset email sent to ' + email);
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      }
    }

    async function handleSignOut() {
      if (!confirm('Sign out of your cloud account on this device?')) return;
      if (window.auth) {
        await window.auth.signOut();
      }
    }

    /*****************************************************************
     * 5. DATE, TIME & MESSAGE FORMATTING HELPERS
     *****************************************************************/
    function formatDateDisplay(dateStr) {
      if (!dateStr) return '';
      const d = new Date(dateStr + 'T00:00:00');
      return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }).replace(/ /g, '-');
    }

    function formatTime12Hr(time24) {
      if (!time24) return '';
      const [hStr, mStr] = time24.split(':');
      let h = parseInt(hStr, 10);
      const ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${String(h).padStart(2, '0')}:${mStr} ${ampm}`;
    }

    function isDateInPeriod(dateStr, period) {
      if (period === 'all') return true;
      const now = new Date();
      const target = new Date(dateStr + 'T00:00:00');
      if (period === 'today') return dateStr === todayStr();
      if (period === 'week') {
        const startOfWeek = new Date(now);
        startOfWeek.setHours(0, 0, 0, 0);
        startOfWeek.setDate(now.getDate() - now.getDay());
        const endOfWeek = new Date(startOfWeek);
        endOfWeek.setDate(startOfWeek.getDate() + 7);
        return target >= startOfWeek && target < endOfWeek;
      }
      if (period === 'month') return target.getFullYear() === now.getFullYear() && target.getMonth() === now.getMonth();
      if (period === 'quarter') {
        return target.getFullYear() === now.getFullYear() && Math.floor(now.getMonth() / 3) === Math.floor(target.getMonth() / 3);
      }
      if (period === 'year') return target.getFullYear() === now.getFullYear();
      return true;
    }

    function compileMessage(template, vars) {
      let msg = template || '';
      const map = {
        '{Name}': vars.name || 'Rider',
        '{RideName}': vars.rideName || '',
        '{Pickup}': vars.pickup || '',
        '{Drop}': vars.drop || '',
        '{Amount}': vars.amount != null ? vars.amount : '',
        '{Date}': vars.date || '',
        '{Time}': vars.time || '',
        '{UPI}': state.settings.upiId || '',
        '{LocationLink}': vars.locationLink || ''
      };
      for (const [key, val] of Object.entries(map)) {
        msg = msg.split(key).join(val);
      }
      return msg;
    }

    function buildWhatsAppUrl(phone, text) {
      const cleanPhone = (phone || '').replace(/[^0-9]/g, '');
      if (cleanPhone) {
        return `https://wa.me/${cleanPhone}?text=${encodeURIComponent(text)}`;
      }
      return `https://wa.me/?text=${encodeURIComponent(text)}`;
    }

     * 7. DASHBOARD & DRILL-DOWN REPORTS
     *****************************************************************/
    function setPeriod(p) {
      dashboardPeriod = p;
      renderApp();
    }

    function renderDashboard() {
      const filteredRides = state.rides.filter(r => isDateInPeriod(r.date, dashboardPeriod));
      const filteredFuel = state.fuelLogs.filter(f => isDateInPeriod(f.date, dashboardPeriod));

      let totalBilled = 0;
      let totalCollected = 0;
      let totalPending = 0;
      let totalTolls = 0;
      const pendingItems = [];
      const riderStats = {};
      const routeStats = {};
      const dateStats = {};

      filteredRides.forEach(ride => {
        const toll = Number(ride.tollCost) || 0;
        totalTolls += toll;

        if (!routeStats[ride.routeName]) {
          routeStats[ride.routeName] = { trips: 0, billed: 0, collected: 0, tolls: 0 };
        }
        routeStats[ride.routeName].trips += 1;
        routeStats[ride.routeName].tolls += toll;

        if (!dateStats[ride.date]) {
          dateStats[ride.date] = { trips: 0, billed: 0, collected: 0 };
        }
        dateStats[ride.date].trips += 1;

        ride.passengers.forEach(p => {
          const fare = Number(p.fare) || 0;
          const paidAmt = p.paid ? (Number(p.paidAmount) || fare) : (Number(p.paidAmount) || 0);
          const due = Math.max(0, fare - paidAmt);

          totalBilled += fare;
          totalCollected += paidAmt;
          totalPending += due;

          routeStats[ride.routeName].billed += fare;
          routeStats[ride.routeName].collected += paidAmt;
          dateStats[ride.date].billed += fare;
          dateStats[ride.date].collected += paidAmt;

          if (!riderStats[p.name]) {
            riderStats[p.name] = { rides: 0, billed: 0, collected: 0, pending: 0, phone: p.phone, company: p.company || '' };
          }
          riderStats[p.name].rides += 1;
          riderStats[p.name].billed += fare;
          riderStats[p.name].collected += paidAmt;
          riderStats[p.name].pending += due;

          if (due > 0 && ride.status === 'completed') {
            pendingItems.push({
              rideId: ride.id,
              rideName: ride.routeName,
              date: ride.date,
              riderId: p.riderId,
              name: p.name,
              phone: p.phone,
              due
            });
          }
        });
      });

      const totalFuelCost = filteredFuel.reduce((sum, f) => sum + (Number(f.totalCost) || 0), 0);
      const netRecovery = totalCollected - (totalFuelCost + totalTolls);
      const paidPct = totalBilled > 0 ? Math.min(100, Math.round((totalCollected / totalBilled) * 100)) : 0;

      const periods = [
        { id: 'today', label: 'Today' },
        { id: 'week', label: 'Week' },
        { id: 'month', label: 'Month' },
        { id: 'quarter', label: 'Quarter' },
        { id: 'year', label: 'Year' },
        { id: 'all', label: 'All Time' }

      const periodPills = periods.map(p => `
        <button onclick="setPeriod('${p.id}')" class="px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition ${dashboardPeriod === p.id ? 'bg-gray-900 text-white shadow-xs' : 'bg-white text-gray-600 border border-gray-200/80'}">
          ${p.label}

      `).join('');

      const pendingHtml = pendingItems.length === 0
        ? `<div class="bg-white rounded-2xl p-4 border border-gray-100 text-center text-xs text-gray-500">All completed rides are settled! No pending dues.</div>`
        : pendingItems.map(item => {
            const reminderText = compileMessage(state.settings.msgReminder, {
              name: item.name,
              rideName: item.rideName,
              amount: item.due,
              date: formatDateDisplay(item.date)
            });
            const waUrl = buildWhatsAppUrl(item.phone, reminderText);
            return `
              <div class="bg-white rounded-2xl p-3.5 border border-orange-100 shadow-xs flex items-center justify-between gap-3">
                <div>
                  <div class="flex items-center gap-1.5">

                  </div>

                <div class="flex items-center gap-1.5">
                  <button onclick="quickMarkPaid('${item.rideId}', '${item.riderId}')" class="bg-gray-100 active:bg-gray-200 text-gray-700 text-[11px] font-semibold px-2.5 py-2 rounded-xl flex items-center gap-1">

                    Remind
                  </a>
                </div>
              </div>
            `;

      const riderEntries = Object.entries(riderStats).sort((a, b) => b[1].billed - a[1].billed);
      const riderReportHtml = riderEntries.length === 0
        ? `<p class="text-xs text-gray-400 text-center py-3">No rider activity in this period.</p>`
        : riderEntries.map(([name, s]) => `
            <button onclick="openRiderDrilldown('${name.replace(/'/g, "\\'")}')" class="w-full text-left py-3 border-b border-gray-100 last:border-0 flex items-center justify-between active:bg-gray-50 rounded-lg px-1 transition">
              <div>
                <div class="flex items-center gap-1.5">
                  <p class="text-sm font-bold text-gray-900">${name}</p>
                  ${s.company ? `<span class="text-[10px] bg-blue-50 text-blue-600 font-semibold px-1.5 py-0.5 rounded">${s.company}</span>` : ''}
                </div>
                <p class="text-[11px] text-gray-500 mt-0.5">${s.rides} ride${s.rides > 1 ? 's' : ''} &bull; Paid ${formatCurrency(s.collected)}</p>
              </div>
              <div class="flex items-center gap-2">
                <div class="text-right">
                  <p class="text-sm font-bold text-gray-900">${formatCurrency(s.billed)}</p>
                  <p class="text-[11px] font-semibold ${s.pending > 0 ? 'text-red-500' : 'text-emerald-600'}">
                    ${s.pending > 0 ? `Due: ${formatCurrency(s.pending)}` : 'Settled'}
                  </p>
                </div>
                ${ICONS.chevron}
              </div>
            </button>
          `).join('');

      const routeEntries = Object.entries(routeStats);
      const routeReportHtml = routeEntries.length === 0
        ? `<p class="text-xs text-gray-400 text-center py-3">No routes logged in this period.</p>`
        : routeEntries.map(([rName, s]) => `
            <button onclick="openRouteDrilldown('${rName.replace(/'/g, "\\'")}')" class="w-full text-left py-3 border-b border-gray-100 last:border-0 flex items-center justify-between active:bg-gray-50 rounded-lg px-1 transition">
              <div>
                <p class="text-sm font-bold text-gray-900">${rName}</p>
                <p class="text-[11px] text-gray-500 mt-0.5">${s.trips} trip${s.trips > 1 ? 's' : ''} &bull; Tolls ${formatCurrency(s.tolls)}</p>
              </div>
              <div class="flex items-center gap-2">
                <div class="text-right">
                  <p class="text-sm font-bold text-gray-900">${formatCurrency(s.collected)}</p>
                  <p class="text-[11px] text-gray-400">of ${formatCurrency(s.billed)}</p>
                </div>
                ${ICONS.chevron}
              </div>
            </button>
          `).join('');

      const dateEntries = Object.entries(dateStats).sort((a, b) => b[0].localeCompare(a[0]));
      const dateReportHtml = dateEntries.length === 0
        ? `<p class="text-xs text-gray-400 text-center py-3">No dates logged in this period.</p>`
        : dateEntries.map(([dStr, s]) => `
            <div class="py-2 border-b border-gray-100 last:border-0 flex items-center justify-between text-xs">
              <div>
                <span class="font-semibold text-gray-800">${formatDateDisplay(dStr)}</span>
                <span class="text-gray-400 ml-1.5">(${s.trips} ride${s.trips > 1 ? 's' : ''})</span>
              </div>
              <div class="font-bold text-gray-900">${formatCurrency(s.collected)} <span class="font-normal text-gray-400">/ ${formatCurrency(s.billed)}</span></div>
            </div>
          `).join('');

      return `
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1">
          ${periodPills}
        </div>

        <div class="bg-gradient-to-br from-gray-900 to-gray-800 text-white rounded-3xl p-4 shadow-sm space-y-3">
          <div class="flex justify-between items-start">
            <div>
              <p class="text-[11px] uppercase tracking-wider text-gray-400 font-semibold">Net Profit (Paid - Fuel - Tolls)</p>
              <p class="text-3xl font-bold mt-1 ${netRecovery >= 0 ? 'text-emerald-400' : 'text-red-400'}">${formatCurrency(netRecovery)}</p>
            </div>
            <span class="bg-white/10 text-gray-200 text-[11px] font-medium px-2.5 py-1 rounded-full">${filteredRides.length} Rides</span>
          </div>

          <div class="bg-white/5 rounded-2xl p-3 space-y-2">
            <div class="flex justify-between text-xs">
              <span class="text-emerald-400 font-bold">Paid: ${formatCurrency(totalCollected)} (${paidPct}%)</span>
              <span class="text-orange-400 font-bold">Due: ${formatCurrency(totalPending)}</span>
            </div>
            <div class="w-full h-2 bg-white/10 rounded-full overflow-hidden">
              <div class="h-full bg-emerald-400 rounded-full" style="width: ${paidPct}%"></div>
            </div>
            <div class="flex justify-between text-[11px] text-gray-400 pt-0.5">
              <span>Total Billed: ${formatCurrency(totalBilled)}</span>
              <span>Fuel: ${formatCurrency(totalFuelCost)} &bull; Tolls: ${formatCurrency(totalTolls)}</span>

            totalPaid += paid;

              time: ride.time,
